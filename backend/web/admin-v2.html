  useEffect(() => {
    api('/referrals')
      .then(r => setData(r.referrers))
      .catch(e => setErr(e.message));
  }, []);

  const loadDetail = async (userId) => {
    if (detail[userId]) return;
    try {
      const r = await api(`/users/${userId}/referrals`);
      setDetail(prev => ({ ...prev, [userId]: r }));
    } catch (e) {
      setDetail(prev => ({ ...prev, [userId]: { error: e.message } }));
    }
  };

  const toggleRow = async (userId) => {
    if (expanded === userId) { setExpanded(null); return; }
    setExpanded(userId);
    await loadDetail(userId);
  };

  const saveLimit = async (userId) => {
    setSaving(true);
    const val = limitInput.trim();
    const payload = val === '' ? { limit: null } : { limit: parseInt(val, 10) };
    try {
      await api(`/users/${userId}/referral-limit`, { method: 'PATCH', body: JSON.stringify(payload) });
      // Refresh list
      const r = await api('/referrals');
      setData(r.referrers);
      // Refresh detail if loaded
      if (detail[userId]) {
        const d = await api(`/users/${userId}/referrals`);
        setDetail(prev => ({ ...prev, [userId]: d }));
      }
      setEditLimit(null);
    } catch (e) {
      alert('Save failed: ' + e.message);
    } finally {
      setSaving(false);
    }
  };

  const fmtDate = ts => ts ? new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  const fmt$ = v => v != null ? `$${Number(v).toFixed(2)}` : '—';

  if (err) return <><h2>Referrals</h2><div className="err">{err}</div></>;

  return (
    <>
      <h2>Referrals</h2>
      <p className="sub">Users who have referral codes. Click a row to see their referees and referee spend.</p>

      {!data
        ? <div className="loading">Loading…</div>
        : data.length === 0
          ? <div style={{color:'#9ca3af',fontSize:14}}>No referral codes issued yet.</div>
          : <div className="panel">
              <table>
                <thead><tr>
                  <th>User</th>
                  <th>Code</th>
                  <th className="num">Referrals</th>
                  <th className="num">Converted</th>
                  <th className="num">Credits</th>
                  <th className="num">Limit</th>
                  <th></th>
                </tr></thead>
                <tbody>
                  {data.map(r => [
                    <tr key={r.userId} style={{cursor:'pointer'}} onClick={() => toggleRow(r.userId)}>
                      <td>{r.email}</td>
                      <td className="mono" style={{fontSize:12,color:'#fbbf24'}}>{r.code}</td>
                      <td className="num">{r.totalReferrals}</td>
                      <td className="num">{r.totalConversions}</td>
                      <td className="num">{r.creditsGranted}</td>
                      <td className="num">
                        {editLimit === r.userId
                          ? <span onClick={e => e.stopPropagation()} style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                              <input
                                type="number" min="0" max="9999"
                                value={limitInput}
                                onChange={e => setLimitInput(e.target.value)}
                                placeholder="default"
                                style={{width:70,padding:'4px 8px',background:'#06090f',border:'1px solid #3b82f6',borderRadius:6,color:'#e5e7eb',fontSize:12}}
                              />
                              <button className="btn btn-primary btn-sm" disabled={saving}
                                onClick={e => { e.stopPropagation(); saveLimit(r.userId); }}>
                                {saving ? '…' : 'Save'}
                              </button>
                              <button className="btn btn-ghost btn-sm"
                                onClick={e => { e.stopPropagation(); setEditLimit(null); }}>
                                ✕
                              </button>
                            </span>
                          : <span>
                              {r.limitOverridden
                                ? <span style={{color:'#fbbf24',fontWeight:600}}>{r.limit} *</span>
                                : r.limit}
                            </span>
                        }
                      </td>
                      <td>
                        <button className="btn btn-ghost btn-sm"
                          onClick={e => {
                            e.stopPropagation();
                            setEditLimit(r.userId);
                            setLimitInput(r.limitOverridden ? String(r.limit) : '');
                          }}>
                          Edit limit
                        </button>
                      </td>
                    </tr>,
                    expanded === r.userId && (
                      <tr key={r.userId + '-detail'}>
                        <td colSpan={7} style={{padding:'0 0 0 24px',background:'#06090f'}}>
                          {!detail[r.userId]
                            ? <div style={{padding:'12px 0',color:'#9ca3af',fontSize:13}}>Loading…</div>
                            : detail[r.userId].error
                              ? <div style={{padding:'12px 0',color:'#ef4444',fontSize:13}}>{detail[r.userId].error}</div>
                              : detail[r.userId].referees.length === 0
                                ? <div style={{padding:'12px 0',color:'#6b7280',fontSize:13}}>No referred users yet.</div>
                                : <table style={{margin:'8px 0'}}>
                                    <thead><tr>
                                      <th>Referee email</th>
                                      <th>Joined</th>
                                      <th>Converted</th>
                                      <th>Plan</th>
                                      <th>Sub status</th>
                                      <th className="num">First charge</th>
                                      <th>Credit</th>
                                    </tr></thead>
                                    <tbody>
                                      {detail[r.userId].referees.map(ref => (
                                        <tr key={ref.userId}>
                                          <td>{ref.email}</td>
                                          <td style={{color:'#9ca3af',fontSize:12}}>{fmtDate(ref.signedUpAt)}</td>
                                          <td style={{color:'#9ca3af',fontSize:12}}>{fmtDate(ref.convertedAt)}</td>
                                          <td>{ref.convertedPlan
                                            ? <span className={`badge badge-${ref.convertedPlan}`}>{ref.convertedPlan}</span>
                                            : <span style={{color:'#6b7280',fontSize:12}}>—</span>}
                                          </td>
                                          <td>
                                            {ref.subStatus
                                              ? <span className={`badge badge-${ref.subStatus === 'active' ? 'active' : 'expired'}`}>{ref.subStatus}</span>
                                              : <span style={{color:'#6b7280',fontSize:12}}>—</span>}
                                          </td>
                                          <td className="num" style={{fontFamily:'DM Mono,monospace'}}>{fmt$(ref.firstChargeAmount)}</td>
                                          <td>
                                            {ref.convertedAt == null
                                              ? <span style={{color:'#9ca3af',fontSize:12}}>Pending</span>
                                              : ref.creditGranted
                                                ? <span style={{color:'#16a34a',fontWeight:600,fontSize:12}}>+1 month</span>
                                                : <span style={{color:'#f59e0b',fontSize:12}}>Limit hit</span>}
                                          </td>
                                        </tr>
                                      ))}
                                    </tbody>
                                  </table>
                          }
                        </td>
                      </tr>
                    ),
                  ])}
                </tbody>
              </table>
            </div>
      }
    </>
  );
}

// ── Revenue tab (StarSol extension) ───────────────────────────────
function RevenueTab() {
  const [data,setData]=useState(null),[err,setErr]=useState('');
  const load=async()=>{setData(null);setErr('');try{setData(await api('/revenue/history'));}catch(e){setErr(e.message);}};
  useEffect(()=>{load();},[]);
  if(err)return <><h2>Revenue</h2><div className="err">Could not load revenue history: {err}</div><button className="btn btn-ghost btn-sm" onClick={load}>Try again</button></>;
  if(!data)return <><h2>Revenue</h2><div className="loading">Loading revenue history…</div></>;
  const rows=(data.quarters||data.quarterly||[]).map(r=>({quarter:r.quarter||r.label||r.key,revenue:r.revenue??r.gross??r.amount,invoices:r.invoices??r.invoiceCount??0}));
  const gross=data.lifetimeGrossRevenue??data.lifetimeGross??data.lifetimeGrossCollected??data.grossCollected??null;
  const providers=data.providers||data.providerAvailability||{};
  const max=Math.max(1,...rows.map(r=>Number(r.revenue||0)));
  return <>
    <h2>Revenue</h2><div className="sub">Gross collected revenue by calendar quarter.</div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:14,marginBottom:18}}>
      <BigStat label="Lifetime gross collected" value={moneyOrUnknown(gross)} sub="Before fees, refunds, and taxes unless the provider reports otherwise" />
      <div className="panel" style={{padding:'14px 18px'}}><div style={{fontSize:11,color:'#9ca3af',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>Completeness</div><div style={{fontSize:18,fontWeight:700,color:data.complete?'#6ee7b7':'#fbbf24'}}>{data.complete?'Complete':'Partial'}</div><div style={{fontSize:12,color:'#9ca3af',marginTop:4}}>{data.note||data.completenessNote||(data.complete?'All configured providers included.':'One or more providers unavailable.')}</div></div>
    </div>
    {Object.keys(providers).length>0&&<div className="panel" style={{padding:'12px 18px',marginBottom:18,display:'flex',gap:14,flexWrap:'wrap'}} aria-label="Revenue provider availability">{Object.entries(providers).map(([name,value])=>{const detail=typeof value==='object'?value:{available:value===true||value==='available'},available=!!detail.available,label={stripe:'Stripe',play:'Google Play',apple:'Apple'}[name]||name;return <span key={name} aria-label={`${label}: ${available?'available':'unavailable'}, gross ${moneyOrUnknown(detail.grossRevenue)}`}><strong>{label}</strong> <Badge kind={available?'active':'expired'}>{available?'available':'unavailable'}</Badge> <span style={{color:'#9ca3af',fontSize:12}}>gross {moneyOrUnknown(detail.grossRevenue)}{detail.invoiceCount!=null?` · ${detail.invoiceCount} invoices`:''}</span></span>})}</div>}
    {rows.length===0?<div className="panel empty">No collected revenue history is available yet.</div>:<>
      <figure className="panel" style={{padding:'18px',marginBottom:18,overflowX:'auto'}} aria-label="Quarterly gross collected revenue bar chart">
        <div style={{display:'flex',alignItems:'flex-end',gap:10,height:190,minWidth:Math.max(320,rows.length*74)}}>{rows.map((r,i)=>{const value=Number(r.revenue??r.gross??0);return <div key={r.quarter||i} style={{flex:'1 0 56px',height:'100%',display:'flex',flexDirection:'column',justifyContent:'flex-end',alignItems:'center',gap:5}} role="img" aria-label={`${r.quarter}: ${moneyOrUnknown(value)}, ${Number(r.invoices||0)} invoices`}><span className="mono" style={{fontSize:10,color:'#9ca3af'}}>{moneyOrUnknown(value)}</span><div style={{height:`${Math.max(2,value/max*140)}px`,width:'100%',maxWidth:54,background:'#fbbf24',borderRadius:'5px 5px 0 0'}}/><span className="mono" style={{fontSize:11,color:'#9ca3af',whiteSpace:'nowrap'}}>{r.quarter}</span></div>})}</div>
      </figure>
      <div className="panel" style={{overflowX:'auto'}}><table><thead><tr><th>Quarter</th><th className="num">Revenue</th><th className="num">Invoices</th></tr></thead><tbody>{rows.map((r,i)=><tr key={r.quarter||i}><td className="mono">{r.quarter}</td><td className="num">{moneyOrUnknown(r.revenue??r.gross)}</td><td className="num">{Number(r.invoices||0).toLocaleString()}</td></tr>)}</tbody></table></div>
    </>}
  </>;
}

async function flightRootApi(path,opts={}){const r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+getToken(),...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j;}

 <div className="panel" style={{marginBottom:18}}><div className="panel-hdr"><h3>Live TVs &amp; usage telemetry</h3><div className="right"><button className="btn btn-ghost btn-sm" onClick={load}>Refresh</button><button className="btn btn-primary btn-sm" onClick={async()=>{if(!confirm('Push a reload to every connected TV?'))return;try{const result=await flightRootApi('/reload',{method:'POST',body:JSON.stringify({message:'Update pushed from admin'})});setFlash(`Reload sent to ${Number(result.clients||0)} connected TV${Number(result.clients||0)===1?'':'s'}.`);}catch(e){setErr(e.message);}}}>Push reload</button></div></div><div style={{padding:18,display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12}}><BigStat label="Connected TVs" value={d.tv?.connected??0}/><BigStat label="New users today" value={d.metrics?.users?.today||0}/><BigStat label="New users this week" value={d.metrics?.users?.thisWeek||0}/><BigStat label="New users this month" value={d.metrics?.users?.thisMonth||0}/><BigStat label="Active subscriptions" value={d.metrics?.subscriptions?.active||0}/><BigStat label="Usage 24h" value={fmtDur(eng.usageMs24h||0)}/><BigStat label="Usage 7d" value={fmtDur(eng.usageMs7d||0)}/><BigStat label="Sessions 30d" value={eng.totalSessions30d||0}/><BigStat label="Avg session" value={fmtDur(eng.avgSessionMs30d||0)}/></div><div style={{overflowX:'auto'}}><table><thead><tr><th>Platform</th><th className="num">Sessions</th><th className="num">Usage</th><th className="num">Active</th></tr></thead><tbody>{(eng.bySource||[]).map(r=><tr key={r.source}><td>{r.source}</td><td className="num">{r.sessions||0}</td><td className="num">{fmtDur(r.totalMs||0)}</td><td className="num">{r.active||0}</td></tr>)}{!(eng.bySource||[]).length&&<tr><td colSpan="4" className="empty">No platform telemetry yet.</td></tr>}</tbody></table></div><div style={{padding:14,display:'flex',gap:8,flexWrap:'wrap'}}>{(eng.topEvents7d||[]).map(e=><Badge key={e.event} kind="free">{e.event} ×{e.count}</Badge>)}{!(eng.topEvents7d||[]).length&&<span style={{color:'#6b7280'}}>No recent events.</span>}</div></div>
 <div className="panel" style={{marginBottom:18}}><div className="panel-hdr"><h3>Revenue, dunning &amp; billing events</h3><div className="right"><button className="btn btn-ghost btn-sm" onClick={()=>location.hash='#revenue'}>Revenue history</button></div></div><div style={{padding:18,display:'flex',gap:12,flexWrap:'wrap'}}><BigStat label="Current MRR" value={moneyOrUnknown(rev.mrr)}/><BigStat label="Next committed MRR" value={moneyOrUnknown(rev.nextMrr)}/><BigStat label="ARR at current MRR" value={moneyOrUnknown(rev.arr)}/><span style={{color:'#9ca3af',alignSelf:'center'}}>{rev.note||''}</span></div><div style={{overflowX:'auto'}}><table><thead><tr><th>Provider</th><th className="num">Subscriptions</th><th className="num">Current MRR</th><th className="num">Next MRR</th></tr></thead><tbody>{Object.entries(rev.breakdown||{}).map(([k,v])=><tr key={k}><td className="mono">{k.replaceAll('_',' ')}</td><td className="num">{v.count}</td><td className="num">{moneyOrUnknown(v.mrr)}</td><td className="num">{moneyOrUnknown(v.nextMrr)}</td></tr>)}</tbody></table><table><thead><tr><th>Past-due user</th><th>Plan</th><th>Updated</th></tr></thead><tbody>{(rev.dunning||[]).map((r,i)=><tr key={i}><td>{r.email}</td><td>{r.plan}</td><td>{fmtDate(r.updated_at)}</td></tr>)}{!(rev.dunning||[]).length&&<tr><td colSpan="3" className="empty">No past-due subscriptions.</td></tr>}</tbody></table><table><thead><tr><th>Billing event</th><th>User</th><th>Time</th></tr></thead><tbody>{(rev.events||[]).map((r,i)=><tr key={i}><td className="mono">{r.type}</td><td>{r.email||'—'}</td><td>{fmtDate(r.ts)}</td></tr>)}{!(rev.events||[]).length&&<tr><td colSpan="3" className="empty">No recent billing events.</td></tr>}</tbody></table></div></div>

 <div className="panel" style={{marginBottom:18}}><div className="panel-hdr"><h3>StarSol content &amp; catalog status</h3></div>{flight.stubMode&&<div className="err" style={{display:'block',margin:14}}>Content service reports degraded mode.</div>}<div style={{padding:18,display:'flex',gap:12,flexWrap:'wrap'}}><BigStat label="Published content" value={flight.today||0}/><BigStat label="Ambient images" value={flight.thisMonth||0}/><BigStat label="Catalog status" value={flight.stubMode?'ON':'OFF'}/></div><div style={{overflowX:'auto'}}><table><thead><tr><th>Endpoint</th><th className="num">Calls</th><th className="num">Avg ms</th><th className="num">Cache hits</th></tr></thead><tbody>{(flight.byEndpoint||[]).map(r=><tr key={r.endpoint}><td className="mono">{r.endpoint}</td><td className="num">{r.calls}</td><td className="num">{r.avgMs||'—'}</td><td className="num">{r.cacheHits||0}</td></tr>)}</tbody></table><table><thead><tr><th>Recent content</th><th>City</th><th className="num">Published</th></tr></thead><tbody>{(d.airports||[]).map((a,i)=><tr key={a.iata||a.iata_code||i}><td className="mono">{a.iata||a.iata_code||a.code}</td><td>{a.city||'—'}</td><td className="num">{a.count??a.saves??a.n??'—'}</td></tr>)}{!(d.airports||[]).length&&<tr><td colSpan="3" className="empty">No content records yet.</td></tr>}</tbody></table></div></div><PasswordOps done={done} fail={setErr} onLogout={onLogout}/></>;
}

function FlagOps({rows,superadmin,done,fail}){const [k,setK]=useState(''),[v,setV]=useState('');const save=async(key,value)=>{try{await api('/feature-flags/'+encodeURIComponent(key),{method:'PATCH',body:JSON.stringify({value})});done('Feature flag saved.');}catch(x){fail(x.message);}};return <div className="panel" style={{marginBottom:18}}><div className="panel-hdr"><h3>Feature flags</h3></div><table><thead><tr><th>Key</th><th>Value</th><th></th></tr></thead><tbody>{rows.map(f=><FlagRow key={f.key} flag={f} canEdit={superadmin} save={save}/>)}</tbody></table>{superadmin&&<form style={{padding:18,display:'flex',gap:8,flexWrap:'wrap'}} onSubmit={e=>{e.preventDefault();save(k,v);setK('');setV('');}}><input aria-label="New flag key" value={k} onChange={e=>setK(e.target.value)} placeholder="flag_key" required/><input aria-label="New flag value" value={v} onChange={e=>setV(e.target.value)} placeholder="value"/><button className="btn btn-primary btn-sm">Create flag</button></form>}</div>}

function PromoOps({rows,superadmin,done,fail}){const [v,setV]=useState({code:'',discountType:'percent',discountValue:'',maxRedemptions:''});return <div className="panel" style={{marginBottom:18}}><div className="panel-hdr"><h3>Discount promo codes</h3></div>{superadmin&&<form style={{padding:18,display:'flex',gap:8,flexWrap:'wrap'}} onSubmit={async e=>{e.preventDefault();try{await api('/promo-codes',{method:'POST',body:JSON.stringify({...v,discountValue:Number(v.discountValue),maxRedemptions:v.maxRedemptions?Number(v.maxRedemptions):null})});setV({code:'',discountType:'percent',discountValue:'',maxRedemptions:''});done('Discount created.');}catch(x){fail(x.message);}}}><input aria-label="Discount code" value={v.code} onChange={e=>setV({...v,code:e.target.value.toUpperCase()})} placeholder="CODE" required/><select aria-label="Discount type" value={v.discountType} onChange={e=>setV({...v,discountType:e.target.value})}><option value="percent">% off</option><option value="fixed">$ off</option></select><input aria-label="Discount value" type="number" value={v.discountValue} onChange={e=>setV({...v,discountValue:e.target.value})} required/><input aria-label="Maximum redemptions" type="number" value={v.maxRedemptions} onChange={e=>setV({...v,maxRedemptions:e.target.value})}/><button className="btn btn-primary btn-sm">Create discount</button></form>}<table><thead><tr><th>Code</th><th>Discount</th><th>Uses</th><th>Status</th><th></th></tr></thead><tbody>{rows.map(p=><tr key={p.id}><td className="mono">{p.code}</td><td>{p.discountType==='percent'?p.discountValue+'%':moneyOrUnknown(p.discountValue)}</td><td>{p.redemptions||0}{p.maxRedemptions?'/'+p.maxRedemptions:''}</td><td>{p.active?'Active':'Disabled'}</td><td>{p.active&&superadmin&&<button className="btn btn-danger btn-sm" onClick={async()=>{if(!confirm('Disable this discount?'))return;try{await api('/promo-codes/'+p.id+'/disable',{method:'PATCH'});done('Discount disabled.');}catch(x){fail(x.message);}}}>Disable</button>}</td></tr>)}</tbody></table></div>}
function PasswordOps({done,fail,onLogout}){const [v,setV]=useState({currentPassword:'',newPassword:'',confirm:''});return <div className="panel"><div className="panel-hdr"><h3>Admin password</h3></div><form style={{padding:18,maxWidth:520}} onSubmit={async e=>{e.preventDefault();if(v.newPassword!==v.confirm)return fail('Passwords do not match.');if(v.newPassword.length<8)return fail('New password must be at least 8 characters.');if(!confirm('Change your password?'))return;try{const result=await api('/me/password',{method:'POST',body:JSON.stringify({currentPassword:v.currentPassword,newPassword:v.newPassword})});if(result.reloginRequired){setToken(null);onLogout();return;}done('Password updated.');}catch(x){fail(x.message);}}}><div className="field"><label>Current password</label><input type="password" value={v.currentPassword} onChange={e=>setV({...v,currentPassword:e.target.value})} required/></div><div className="field"><label>New password</label><input type="password" minLength="8" value={v.newPassword} onChange={e=>setV({...v,newPassword:e.target.value})} required/></div><div className="field"><label>Confirm new password</label><input type="password" minLength="8" value={v.confirm} onChange={e=>setV({...v,confirm:e.target.value})} required/></div><button className="btn btn-primary">Update password</button></form></div>}

// ── Shell ──────────────────────────────────────────────────────────────
// Tab IDs that have first-class URL state. Anything not in this set falls
// back to 'overview' on initial load. Matches the buttons rendered below.
const VALID_TABS = new Set(['overview','users','subs','revenue','operations','errors','invites','referrals','email','audit']);

function readTabFromHash() {
  const raw = (window.location.hash || '').replace(/^#/, '');
  return VALID_TABS.has(raw) ? raw : 'overview';
}

function App() {
  const [me, setMe]     = useState(null);
  const [boot, setBoot] = useState(true);
  const [tab, setTabState] = useState(readTabFromHash);
  // Wrap setTab so changing a tab also updates the URL — gives the user
  // shareable links and preserves position across refreshes.
  const setTab = (next) => {
    setTabState(next);
    if (window.location.hash !== '#' + next) {
      // pushState so browser back/forward step through tab history.
      history.pushState({ tab: next }, '', '#' + next);
    }
  };

  // React to back/forward + hash edits in the address bar.
  useEffect(() => {
    const onHash = () => setTabState(readTabFromHash());
    window.addEventListener('hashchange', onHash);
    window.addEventListener('popstate', onHash);
    return () => {
      window.removeEventListener('hashchange', onHash);
      window.removeEventListener('popstate', onHash);
    };
  }, []);

  // Validate token on mount
  useEffect(() => {
    const t = getToken();
    if (!t) { setBoot(false); return; }
    api('/me').then(r => { setMe(r.user); }).catch(() => { setToken(null); }).finally(() => setBoot(false));
  }, []);

  if (boot) return <div className="loading" style={{marginTop:100}}>Loading…</div>;
  if (!me)  return <Login onLogin={setMe} />;

  const logout = () => { setToken(null); setMe(null); };

  return (
    <div className="shell">
      <div className="topbar">
        <div className="logo">Star<span className="dot">·</span>Sol</div>
        <span className="tag">ADMIN</span>
        <div className="topbar-right">
          <span>{me.email} <RoleBadge role={me.role} /></span>
          <button className="btn-link" onClick={logout}>Sign out</button>
        </div>
      </div>
      <div className="tabs">
        <button className={'tab' + (tab==='overview'? ' active':'')} onClick={()=>setTab('overview')}>Overview</button>
        <button className={'tab' + (tab==='users'   ? ' active':'')} onClick={()=>setTab('users')}>Users</button>
        <button className={'tab' + (tab==='subs'    ? ' active':'')} onClick={()=>setTab('subs')}>Subscriptions</button>
        <button className={'tab' + (tab==='revenue' ? ' active':'')} onClick={()=>setTab('revenue')}>Revenue</button>
        <button className={'tab' + (tab==='operations' ? ' active':'')} onClick={()=>setTab('operations')}>Operations</button>
        <button className={'tab' + (tab==='errors'  ? ' active':'')} onClick={()=>setTab('errors')}>Errors</button>
        <button className={'tab' + (tab==='invites'   ? ' active':'')} onClick={()=>setTab('invites')}>Invite codes</button>
        <button className={'tab' + (tab==='referrals' ? ' active':'')} onClick={()=>setTab('referrals')}>Referrals</button>
        <button className={'tab' + (tab==='email'     ? ' active':'')} onClick={()=>setTab('email')}>Email</button>
        <button className={'tab' + (tab==='audit'     ? ' active':'')} onClick={()=>setTab('audit')}>Audit log</button>
      </div>
      <div className="page">
        {tab==='overview' && <OverviewTab me={me} />}
        {tab==='users'   && <UsersTab me={me} />}
        {tab==='subs'    && <SubscriptionsTab />}
        {tab==='revenue' && <RevenueTab />}
        {tab==='operations' && <OperationsTab me={me} onLogout={logout} />}
        {tab==='errors'  && <ErrorsTab />}
        {tab==='invites'   && <InvitesTab />}
        {tab==='referrals' && <ReferralsTab />}
        {tab==='email'     && <EmailTab />}
        {tab==='audit'     && <AuditTab />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>StarSol — Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=optional" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" crossorigin="anonymous" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"></script>
<!-- Used to render the otpauth:// URL as a QR for authenticator apps. -->
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;background:#0b0f14;color:#e5e7eb;font-family:'Space Grotesk',sans-serif;font-size:14px}
#root{width:100%;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:#60a5fa;text-decoration:none}

.mono{font-family:'DM Mono',monospace}

/* Layout */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid #1f2937;background:#06090f;position:sticky;top:0;z-index:10}
.logo{font-weight:700;font-size:17px;letter-spacing:-0.01em}
.logo .dot{color:#fbbf24}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:#1e293b;color:#fbbf24;margin-left:10px;font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;color:#9ca3af;font-size:13px}
.btn-link{background:none;color:#9ca3af;padding:6px 10px;border-radius:6px;font-size:13px}
.btn-link:hover{background:#1f2937;color:#e5e7eb}

.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid #1f2937;background:#06090f}
.tab{padding:13px 18px;background:none;color:#9ca3af;font-size:14px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:#e5e7eb}
.tab.active{color:#fbbf24;border-bottom-color:#fbbf24}

.page{padding:24px;max-width:1400px;width:100%;margin:0 auto;flex:1}
.page h2{font-size:20px;font-weight:600;margin-bottom:4px}
.page .sub{color:#9ca3af;font-size:13px;margin-bottom:20px}

/* Cards / panels */
.panel{background:#06090f;border:1px solid #1f2937;border-radius:10px;overflow:hidden}
.panel-hdr{padding:14px 18px;border-bottom:1px solid #1f2937;display:flex;align-items:center;gap:12px}
.panel-hdr h3{font-size:15px;font-weight:600}
.panel-hdr .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid #1f2937}
th{font-weight:600;color:#9ca3af;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;background:#06090f}
tr:hover td{background:#131b26}
td.num{text-align:right;font-variant-numeric:tabular-nums}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:#9ca3af;font-weight:500}
.field input,.field select,.field textarea{background:#06090f;border:1px solid #1f2937;border-radius:8px;color:#e5e7eb;padding:10px 12px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#3b82f6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Buttons */
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:opacity .15s,background .15s}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:#fbbf24;color:#0b0f14}
.btn-primary:hover:not(:disabled){background:#f59e0b}
.btn-ghost{background:#1f2937;color:#e5e7eb}
.btn-ghost:hover:not(:disabled){background:#374151}
.btn-danger{background:#b91c1c;color:white}
.btn-danger:hover:not(:disabled){background:#991b1b}
.btn-sm{padding:5px 10px;font-size:12px;font-weight:500}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:0.02em}
.badge-free{background:#1f2937;color:#9ca3af}
.badge-explorer{background:#1e3a8a;color:#93c5fd}
.badge-observer{background:#5b21b6;color:#ddd6fe}
.badge-active{background:#064e3b;color:#6ee7b7}
.badge-suspended{background:#7f1d1d;color:#fca5a5}
.badge-deleted{background:#1f2937;color:#6b7280}
.badge-admin{background:#92400e;color:#fde68a}
.badge-superadmin{background:#9a3412;color:#fed7aa}
.badge-user{background:#1f2937;color:#9ca3af}
.badge-expired{background:#1f2937;color:#6b7280}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:#06090f;border:1px solid #1f2937;border-radius:14px;padding:32px}
.login-card h1{font-size:22px;font-weight:700;margin-bottom:4px}
.login-card .sub{color:#9ca3af;font-size:13px;margin-bottom:24px}
.err{background:#450a0a;border:1px solid #7f1d1d;color:#fca5a5;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.ok{background:#064e3b;border:1px solid #065f46;color:#6ee7b7;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#06090f;border:1px solid #1f2937;border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-hdr{padding:16px 20px;border-bottom:1px solid #1f2937;display:flex;align-items:center}
.modal-hdr h3{font-size:16px;font-weight:600}
.modal-hdr .close{margin-left:auto;background:none;color:#9ca3af;padding:4px 8px;border-radius:6px;font-size:18px}
.modal-hdr .close:hover{background:#1f2937;color:#e5e7eb}
.modal-body{padding:20px}
.modal-ftr{padding:14px 20px;border-top:1px solid #1f2937;display:flex;justify-content:flex-end;gap:10px}

.empty{padding:40px;text-align:center;color:#6b7280;font-size:14px}
.loading{padding:40px;text-align:center;color:#6b7280;font-size:13px}

.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 16px;font-size:13px;margin-bottom:16px}
.kv dt{color:#9ca3af}
.kv dd{color:#e5e7eb;word-break:break-word}

.search{background:#06090f;border:1px solid #1f2937;border-radius:8px;padding:8px 12px;color:#e5e7eb;width:280px}
.search:focus{outline:none;border-color:#3b82f6}

@media (max-width:700px){
  .topbar{padding:12px 16px}
  .tabs{padding:0 16px;overflow-x:auto}
  .page{padding:16px}
  .field-row{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  table{font-size:12px}
  th,td{padding:8px 10px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ── API helper ─────────────────────────────────────────────────────────
const TOKEN_KEY = 'starsol_admin_token';
function getToken()  { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }

// ── StarSol compatibility layer ───────────────────────────────────
// Keep the Stock UI contract intact while translating StarSol's API names
// and camelCase payloads at this single boundary.
const flightErrorDetails = new Map();
function adaptFlightRequest(path, opts = {}) {
  return { path, opts: { ...opts } };
}
function flightTrial(u) {
  if (!u.hasTrial && !u.trialStartedAt) return null;
  const startedAt=u.trialStartedAt==null?null:Number(u.trialStartedAt), daysTotal=Number(u.trialDaysTotal)||null;
  if (!startedAt || !daysTotal) return { active:false,converted:!!u.trialConverted,expired:false,daysLeft:null,startedAt,granted:true };
  const ends=startedAt+daysTotal*86400000;
  return { active:!u.trialConverted&&Date.now()<ends,converted:!!u.trialConverted,expired:!u.trialConverted&&Date.now()>=ends,daysLeft:Math.max(0,Math.ceil((ends-Date.now())/86400000)),startedAt,daysTotal,granted:true };
}
function normalizeFlightUser(u = {}) {
  return { ...u, signup_method:u.signup_method||u.signupMethod||'email', created_at:u.created_at||u.createdAt,
    last_login_at:u.last_login_at||u.lastLoginAt, payment_source:u.payment_source||u.paymentSource,
    status:u.status||(u.suspended||(u.locked_until&&Number(u.locked_until)>Date.now())?'suspended':'active'), trial:u.trial||flightTrial(u),
    trial_started_at:u.trial_started_at||u.trialStartedAt, trial_converted_at:u.trial_converted_at||u.trialConvertedAt,
    emailConsents:u.emailConsents||{productUpdates:u.marketingConsent!==false,marketing:!!u.marketingConsent},
    total_usage_ms:Number(u.total_usage_ms||0),session_count:Number(u.session_count||0),tv_app_opens:Number(u.tv_app_opens||0),wl_count:Number(u.wl_count||0) };
}
function normalizeFlightResponse(originalPath, data = {}) {
  if (originalPath.startsWith('/users?')) return { ...data, users:(data.users||[]).map(normalizeFlightUser) };
  if (/^\/users\/\d+$/.test(originalPath)) return { ...data, user:normalizeFlightUser(data.user),
    paymentSources:(data.paymentSources||[]).map(s=>({...s,billing_interval:s.billing_interval||s.interval,expires_ms:s.expires_ms||s.expiresAt,updated_at:s.updated_at||s.updatedAt})),
    settings:data.settings||null,suspensions:data.suspensions||[],recentEvents:data.recentEvents||[] };
  if (/^\/users\/\d+\/analytics$/.test(originalPath)) return { errorCount:0,tvAppOpens:0,bySource:[],featureUsage:[],clicksFirst3Sessions:0,...data };
  if (originalPath === '/metrics') return { ...data, activeBySource:data.activeBySource||[],signupsByDay:data.signupsByDay||[],errorsByDay:data.errorsByDay||[],tvByPlatform:data.tvByPlatform||{},revenue:{mrrApprox:null,bySource:{},note:'',...(data.revenue||{})} };
  if (originalPath.startsWith('/subscriptions?')) return { ...data, subs:(data.subscriptions||data.subs||[]).map(s=>({...s,billing_interval:s.billing_interval||s.interval_type,expires_ms:s.expires_ms||s.expires_at,updated_at:s.updated_at||s.updatedAt})) };
  if (originalPath === '/errors') {
    const groups=(data.errors||data.groups||[]).map(g=>{const signature=g.signature_hash||g.signature;const rows=(g.occurrences||[]).map(o=>({id:o.id,ts:o.ts,user_email:o.user_email||o.email,user_id:o.user_id||o.userId,source:o.source,message:o.message||o.data?.message||o.event,url:o.url||o.data?.url,stack:o.stack||o.data?.stack}));flightErrorDetails.set(signature,{rows});return {signature_hash:signature,last_seen:g.last_seen||g.lastSeen,sample_message:g.sample_message||g.message,sample_source:g.sample_source||g.source,users_affected:g.users_affected??g.users??0,occurrences:Number(g.occurrences_count??g.hits??rows.length)};});
    return {groups,sinceMs:data.sinceMs||0};
  }
  if (/^\/errors\//.test(originalPath)) return flightErrorDetails.get(originalPath.slice(8))||{rows:[]};
  if (originalPath === '/audit') return {entries:(data.entries||[]).map(e=>({...e,actor_email:e.actor_email||e.actorEmail,actor_user_id:e.actor_user_id||e.actorUserId,target_email:e.target_email||e.targetEmail,target_user_id:e.target_user_id||e.targetUserId,ip_address:e.ip_address||e.ip}))};
  if (originalPath === '/invites') return {...data,invites:(data.codes||data.invites||[]).map(c=>{const uses=Number(c.uses||0);return {...c,plan_override:c.plan_override||c.planGrant,max_uses:c.active===false?uses:(c.max_uses??c.maxUses??Infinity),expires_at:c.expires_at||c.expiresAt,note:c.note||c.notes,created_at:c.created_at||c.createdAt,uses};})};
  if (originalPath === '/referrals') return {referrers:(data.referrals||data.referrers||[]).map(r=>({...r,totalReferrals:r.totalReferrals??r.conversions,totalConversions:r.totalConversions??r.conversions,creditsGranted:r.creditsGranted??Math.floor((r.creditDays||0)/30),limit:r.limit??r.maxConversions??10,limitOverridden:r.limitOverridden??(r.maxConversions!=null)}))};
  if (/^\/users\/\d+\/referrals$/.test(originalPath)) return {referees:(data.conversions||data.referees||[]).map(r=>({...r,userId:r.userId||r.refereeId,email:r.email||r.refereeEmail,signedUpAt:r.signedUpAt||r.createdAt,convertedAt:r.convertedAt||r.creditGrantedAt,convertedPlan:r.convertedPlan||r.plan,subStatus:r.subStatus||null,firstChargeAmount:r.firstChargeAmount??null}))};
  return data;
}

async function api(path, opts = {}) {
  if (/^\/errors\//.test(path) && flightErrorDetails.has(path.slice(8))) return normalizeFlightResponse(path, {});
  const adapted = adaptFlightRequest(path, opts);
  const t = getToken();
  const r = await fetch('/api/admin' + adapted.path, {
    ...adapted.opts,
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json',
      'X-StarSol-Client': 'starsol-admin/2.0',
      ...(t ? { Authorization: 'Bearer ' + t } : {}),
      ...(adapted.opts.headers || {}),
    },
  });
  const json = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(json.error || `HTTP ${r.status}`);
  return normalizeFlightResponse(path, json);
}
async function loginApi(email, password) {
  const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify({email,password}) });
  const json = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(json.error || `HTTP ${r.status}`);
  return json;
}

// ── Formatting ─────────────────────────────────────────────────────────
const fmtDate = ts => !ts ? '—' : new Date(ts).toLocaleString();
const fmtShort = ts => !ts ? '—' : new Date(ts).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
const fmtShortTime = ts => !ts ? '—' : new Date(ts).toLocaleString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
function fmtSignupLocation(u) {
  if (!u) return '—';
  const bits = [u.signup_city, u.signup_region, u.signup_country].filter(Boolean);
  return bits.length ? bits.join(', ') : '—';
}
function fmtSignupCountry(u) {
  if (!u?.signup_country) return '—';
  const c = String(u.signup_country).trim().toUpperCase();
  return c.length > 8 ? c.slice(0, 8) : c;
}

function Badge({ kind, children }) {
  return <span className={'badge badge-' + kind}>{children}</span>;
}
function PlanBadge({ plan })   { return <Badge kind={plan || 'free'}>{plan || 'free'}</Badge>; }
function StatusBadge({ s })    { return <Badge kind={s || 'active'}>{s || 'active'}</Badge>; }
function RoleBadge({ role })   { return <Badge kind={role || 'user'}>{role || 'user'}</Badge>; }
// Signup method — 'email' (password), 'google' (OAuth), 'apple' (OAuth).
// Renders a small label next to plan so we can spot social-vs-password mix.
function SignupMethodBadge({ m }) {
  const method = m || 'email';
  const styleMap = {
    email:  { bg: '#1e293b', fg: '#94a3b8', label: '✉ Email' },
    google: { bg: '#fef3c7', fg: '#92400e', label: 'G Google' },
    apple:  { bg: '#0f172a', fg: '#e2e8f0', label: ' Apple' },
  };
  const s = styleMap[method] || styleMap.email;
  return <span style={{display:'inline-block',padding:'2px 8px',borderRadius:6,background:s.bg,color:s.fg,fontSize:10,fontWeight:700,letterSpacing:'0.04em',whiteSpace:'nowrap'}}>{s.label}</span>;
}
// Render an exact consent state instead of saying "Unsubscribed". A user can
// be off because signup defaulted off, not because they clicked unsubscribe.
function UnsubChip({ email }) {
  if (!email || email.productUpdates !== false) return null;
  return <span title="Product update emails are off"
               style={{display:'inline-block',marginLeft:6,padding:'1px 6px',borderRadius:4,background:'#1e293b',color:'#fb923c',fontSize:10,fontWeight:700,letterSpacing:'0.04em'}}>EMAIL OFF</span>;
}
function TrialBadge({ trial }) {
  if (!trial) return <span style={{color:'#6b7280',fontSize:11}}>—</span>;
  if (trial.active)    return <Badge kind="trialing">{trial.daysLeft}d left</Badge>;
  if (trial.converted) return <Badge kind="active">converted</Badge>;
  if (trial.expired)   return <Badge kind="expired">expired</Badge>;
  if (trial.granted)   return <Badge kind="trialing">granted</Badge>;
  return <span style={{color:'#6b7280',fontSize:11}}>—</span>;
}

const SOURCE_LABEL = { stripe: 'Stripe', play: 'Google Play', apple: 'App Store' };
function PaymentSourceCell({ sources }) {
  if (!sources || sources.length === 0) return <span style={{color:'#6b7280'}}>none</span>;
  // Most-recently-updated active row wins. If none active, show the most recent.
  const active = sources.find(s => s.status === 'active' || s.status === 'trialing') || sources[0];
  const label = SOURCE_LABEL[active.source] || active.source;
  return (
    <span>
      <strong>{label}</strong>
      {active.billing_interval && <span style={{color:'#9ca3af'}}> · {active.billing_interval}</span>}
      {active.status && <span style={{color: active.status === 'active' ? '#6ee7b7' : '#fbbf24', marginLeft:6}}>· {active.status}</span>}
      {sources.length > 1 && <span style={{color:'#6b7280',marginLeft:6,fontSize:11}}>(+{sources.length - 1} prior)</span>}
    </span>
  );
}

function fmtDur(ms) {
  if (!ms || ms < 0) return '0s';
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ' + (s % 60) + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

function Stat({ label, value, tone }) {
  const colors = { good: '#6ee7b7', warn: '#fbbf24', mute: '#9ca3af' };
  const valueColor = colors[tone] || '#e5e7eb';
  return (
    <div>
      <div style={{fontSize:10,color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:2}}>{label}</div>
      <div style={{fontSize:18,fontWeight:600,color:valueColor,fontVariantNumeric:'tabular-nums'}}>{value}</div>
    </div>
  );
}

// ── Login screen (multi-step: password → TOTP code OR enrollment) ──────
function Login({ onLogin }) {
  const [step, setStep] = useState('password');     // 'password' | 'totp' | 'recovery' | 'enroll'
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [code, setCode] = useState('');
  const [recovery, setRecovery] = useState('');
  const [challengeToken, setChallengeToken] = useState('');
  const [enrollToken, setEnrollToken] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submitPassword(e) {
    e.preventDefault();
    setErr(''); setBusy(true);
    try {
      const r = await loginApi(email, pw);
      if (r.needsTotp) {
        setChallengeToken(r.challengeToken);
        setStep('totp');
      } else if (r.needsEnrollment) {
        setEnrollToken(r.enrollToken);
        setStep('enroll');
      } else {
        setToken(r.token);
        onLogin(r.user);
      }
    } catch (e) { setErr(e.message); }
    finally    { setBusy(false); }
  }

  async function submitTotp(e) {
    e.preventDefault();
    setErr(''); setBusy(true);
    try {
      const r = await api('/login/totp', { method:'POST',
        body: JSON.stringify({ challengeToken, code }) });
      setToken(r.token); onLogin(r.user);
    } catch (e) { setErr(e.message); }
    finally    { setBusy(false); }
  }

  async function submitRecovery(e) {
    e.preventDefault();
    setErr(''); setBusy(true);
    try {
      const r = await api('/login/recovery', { method:'POST',
        body: JSON.stringify({ challengeToken, recoveryCode: recovery }) });
      setToken(r.token); onLogin(r.user);
      if (typeof r.recoveryCodesRemaining === 'number' && r.recoveryCodesRemaining < 3) {
        alert(`Heads up: only ${r.recoveryCodesRemaining} recovery codes left. Re-enroll TOTP to mint a fresh set.`);
      }
    } catch (e) { setErr(e.message); }
    finally    { setBusy(false); }
  }

  return (
    <div className="login-wrap">
      {step === 'password' && (
        <form className="login-card" onSubmit={submitPassword}>
          <h1>StarSol <span style={{color:'#fbbf24'}}>Admin</span></h1>
          <div className="sub">Restricted area. Admin credentials required.</div>
          {err && <div className="err">{err}</div>}
          <div className="field">
            <label>Email</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} autoFocus required />
          </div>
          <div className="field">
            <label>Password</label>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} required />
          </div>
          <button type="submit" className="btn btn-primary" style={{width:'100%',marginTop:8}} disabled={busy}>
            {busy ? 'Signing in…' : 'Continue'}
          </button>
        </form>
      )}

      {step === 'totp' && (
        <form className="login-card" onSubmit={submitTotp}>
          <h1>Two-factor</h1>
          <div className="sub">Enter the 6-digit code from your authenticator app.</div>
          {err && <div className="err">{err}</div>}
          <div className="field">
            <label>Code</label>
            <input className="mono" inputMode="numeric" autoComplete="one-time-code" pattern="[0-9]*"
                   maxLength={6} value={code}
                   onChange={e=>setCode(e.target.value.replace(/\D/g,''))}
                   autoFocus required style={{fontSize:18,letterSpacing:'0.2em',textAlign:'center'}} />
          </div>
          <button type="submit" className="btn btn-primary" style={{width:'100%',marginTop:4}} disabled={busy || code.length !== 6}>
            {busy ? 'Verifying…' : 'Verify'}
          </button>
          <button type="button" className="btn-link" style={{width:'100%',marginTop:10,textAlign:'center'}}
                  onClick={()=>{setErr(''); setStep('recovery');}}>
            Lost your phone? Use a recovery code
          </button>
        </form>
      )}

      {step === 'recovery' && (
        <form className="login-card" onSubmit={submitRecovery}>
          <h1>Recovery code</h1>
          <div className="sub">Each recovery code works exactly once.</div>
          {err && <div className="err">{err}</div>}
          <div className="field">
            <label>Recovery code</label>
            <input className="mono" value={recovery} onChange={e=>setRecovery(e.target.value)}
                   placeholder="xxxx-xxxx-xxxx" autoFocus required />
          </div>
          <button type="submit" className="btn btn-primary" style={{width:'100%',marginTop:4}} disabled={busy}>
            {busy ? 'Verifying…' : 'Sign in'}
          </button>
          <button type="button" className="btn-link" style={{width:'100%',marginTop:10,textAlign:'center'}}
                  onClick={()=>{setErr(''); setStep('totp');}}>
            Back to authenticator code
          </button>
        </form>
      )}

      {step === 'enroll' && (
        <EnrollTotp enrollToken={enrollToken} onDone={(token, user) => {
          setToken(token); onLogin(user);
        }} />
      )}
    </div>
  );
}

// Enrollment flow — shown on first login when ADMIN_REQUIRE_TOTP=1 and the
// account has no totp_secret yet, OR when an authenticated admin re-enrolls.
function EnrollTotp({ enrollToken, sessionToken, onDone }) {
  const [setup, setSetup] = useState(null);   // { otpauth, secret, recoveryCodes, setupToken }
  const [code, setCode]   = useState('');
  const [err, setErr]     = useState('');
  const [busy, setBusy]   = useState(false);
  const [savedRecovery, setSavedRecovery] = useState(false);
  const qrRef = React.useRef(null);

  // Fetch the secret + recovery codes once.
  useEffect(() => {
    (async () => {
      try {
        const tokenForSetup = enrollToken || sessionToken;
        const r = await fetch('/api/admin/totp/setup', {
          method:'POST',
          headers: {
            'Content-Type':'application/json',
            'Authorization': 'Bearer ' + tokenForSetup,
            'X-StarSol-Client': 'starsol-admin/2.0',
          },
          body: '{}',
        });
        const json = await r.json();
        if (!r.ok) throw new Error(json.error || 'setup failed');
        setSetup(json);
      } catch (e) { setErr(e.message); }
    })();
  }, [enrollToken, sessionToken]);

  // Render the QR once we have the otpauth URL.
  useEffect(() => {
    if (setup?.otpauth && qrRef.current && window.QRious) {
      qrRef.current.innerHTML = '';
      const canvas=document.createElement('canvas');qrRef.current.appendChild(canvas);
      new window.QRious({element:canvas,value:setup.otpauth,size:200,padding:4,level:'M'});
    }
  }, [setup]);

  async function verify(e) {
    e.preventDefault();
    if (!savedRecovery) {
      if (!confirm('Did you save your recovery codes somewhere safe? You will not see them again.')) return;
      setSavedRecovery(true);
    }
    setBusy(true); setErr('');
    try {
      const r = await api('/totp/enable', { method:'POST',
        body: JSON.stringify({ setupToken: setup.setupToken, code }) });
      onDone(r.token, r.user);
    } catch (e) { setErr(e.message); setBusy(false); }
  }

  return (
    <div className="login-card" style={{maxWidth: 480}}>
      <h1>Set up two-factor</h1>
      <div className="sub">Required before you can sign in.</div>
      {err && <div className="err">{err}</div>}
      {!setup ? <div className="loading">Loading…</div> : (
        <>
          <div style={{fontWeight:600, fontSize:13, marginTop:6, marginBottom:8}}>1. Scan with your authenticator app</div>
          <div ref={qrRef} style={{display:'flex',justifyContent:'center',background:'#fff',padding:14,borderRadius:10,marginBottom:6}} />
          <div className="mono" style={{fontSize:11,color:'#9ca3af',textAlign:'center',marginBottom:18,wordBreak:'break-all'}}>
            Or enter manually: <strong style={{color:'#e5e7eb'}}>{setup.secret}</strong>
          </div>

          <div style={{fontWeight:600, fontSize:13, marginBottom:8}}>2. Save these recovery codes</div>
          <div style={{background:'#06090f',border:'1px solid #1f2937',borderRadius:8,padding:12,fontFamily:'DM Mono,monospace',fontSize:13,marginBottom:6,display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 16px'}}>
            {setup.recoveryCodes.map((c, i) => <div key={i}>{c}</div>)}
          </div>
          <div style={{fontSize:11,color:'#fbbf24',marginBottom:18}}>
            Each works once. Store somewhere offline — password manager or printed. They're the only way back in if you lose your phone.
          </div>

          <form onSubmit={verify}>
            <div style={{fontWeight:600, fontSize:13, marginBottom:8}}>3. Enter a code from the app to confirm</div>
            <div className="field">
              <input className="mono" inputMode="numeric" pattern="[0-9]*" maxLength={6}
                     value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,''))}
                     style={{fontSize:18,letterSpacing:'0.2em',textAlign:'center'}} required />
            </div>
            <button type="submit" className="btn btn-primary" style={{width:'100%'}} disabled={busy || code.length !== 6}>
              {busy ? 'Enabling…' : 'Enable two-factor'}
            </button>
          </form>
        </>
      )}
    </div>
  );
}

// ── Users tab ──────────────────────────────────────────────────────────
const USERS_PAGE_SIZE = 100;

  const load = useCallback(async () => {
    setRows(null);
    try {
      const params = new URLSearchParams({
        q,
        offset: String(page * USERS_PAGE_SIZE),
        limit: String(USERS_PAGE_SIZE),
      });
      const r = await api('/users?' + params.toString());
      setRows(r.users);
      setTotal(r.total);
    } catch (e) { setRows([]); alert(e.message); }

  useEffect(() => { setPage(0); }, [q]);

  return (
    <>

            {rows.map(u => (

                <td className="mono">{u.id}</td>

                <td className="mono" style={{color: u.tv_app_opens > 0 ? '#e5e7eb' : '#4b5563', fontSize:12}}>{u.tv_app_opens || '—'}</td>
                <td className="mono" style={{color: u.wl_count > 0 ? '#e5e7eb' : '#4b5563', fontSize:12}}>{u.wl_count || '—'}</td>
                <td className="mono" style={{color: u.total_usage_ms > 0 ? '#e5e7eb' : '#4b5563', fontSize:12}} title={u.session_count + ' sessions'}>{u.total_usage_ms > 0 ? fmtDur(u.total_usage_ms) : '—'}</td>
              </tr>
            ))}
            </tbody>
           </table>}
        {rows && rows.length > 0 && (
          <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderTop:'1px solid #1f2937',fontSize:13,color:'#9ca3af'}}>
            <button className="btn btn-ghost btn-sm" disabled={page === 0} onClick={()=>setPage(p=>p-1)}>← Prev</button>
            <span>Page {page + 1} · {Math.min(page * USERS_PAGE_SIZE + 1, total)}–{Math.min((page + 1) * USERS_PAGE_SIZE, total)} of {total}</span>
            <button className="btn btn-ghost btn-sm" disabled={(page + 1) * USERS_PAGE_SIZE >= total} onClick={()=>setPage(p=>p+1)}>Next →</button>

function UserModal({ id, me, onClose }) {
  const [data, setData] = useState(null);
  const [err, setErr]   = useState('');
  const [busy, setBusy] = useState(false);

  const [analytics, setAnalytics] = useState(null);

  const load = useCallback(async () => {
    setData(null); setErr(''); setAnalytics(null);
    try {
      // Detail first (fast), analytics in parallel.
      const [d, a, credits] = await Promise.all([
        api('/users/' + id),
        api('/users/' + id + '/analytics').catch(() => null),
        api('/users/' + id + '/credits').catch(() => ({credits:[]})),
      ]);
      setData({...d,credits:credits.credits||[]});
      setAnalytics(a);
    } catch (e) { setErr(e.message); }
  }, [id]);

  useEffect(() => { load(); }, [load]);

  async function act(path, body) {
    if (!confirm('Confirm?')) return;
    setBusy(true); setErr('');
    try { await api('/users/' + id + path, { method:'POST', body: body ? JSON.stringify(body) : undefined }); await load(); }
    catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  }

  const changePlan = async () => {
    const plan = prompt('New plan: free, explorer, observer, or institutional', data?.user?.plan);
    if (!plan) return;
    act('/plan', { plan });
  };
  const suspend = async () => {
    const reason = prompt('Reason for suspension?');
    if (!reason) return;
    act('/suspend', { reason });
  };
  const unsuspend = () => act('/unsuspend');
  const changeRole = async () => {
    const role = prompt('New role: user, admin, or superadmin', data?.user?.role);
    if (!role) return;
    act('/role', { role });
  };
  const [promoOpen, setPromoOpen] = useState(false);

  const grantTrial = async () => {
    if (!confirm('Grant the configured Pro trial to this user?\n\nThis resets trial_started_at to now and clears trial_converted_at + trial_expired_emitted_at.')) return;
    act('/trial/grant');
  };
  const extendTrial = async () => {
    const days = prompt('Extend the trial by how many days? (1–30)', '7');
    if (!days) return;
    act('/trial/extend', { days: parseInt(days, 10) });
  };
  const endTrial = async () => {
    if (!confirm('End this user\'s trial right now?\n\nNext /api/me will revert them to Free. Use /trial/grant to give them a fresh one later.')) return;
    act('/trial/end');
  };
  const [resetOpen, setResetOpen] = useState(false);
  const [resetMsg, setResetMsg] = useState('');
  const triggerReset = () => {
    setResetMsg('');
    setResetOpen(true);
  };
  const runPasswordReset = async (delivery) => {
    setBusy(true); setErr('');
    try {
      const r = await api('/users/' + id + '/password-reset', {
        method:'POST', body: JSON.stringify({ delivery }),
      });
      const mins = Math.round(r.expiresInMs / 60000);
      if (delivery === 'copy') {
        try {
          await navigator.clipboard.writeText(r.resetUrl);
          setResetMsg(`Reset link copied. It expires in ${mins} min.`);
        } catch (_) {
          window.prompt(`Copy reset link. It expires in ${mins} min:`, r.resetUrl);
          setResetMsg(`Reset link generated. It expires in ${mins} min.`);
        }
      } else {
        setResetMsg(`Reset email sent to ${r.sentTo || 'the user'}.`);
      }
      await load();
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  const u = data?.user;
  const canSuspend = u && u.id !== me.id && u.role !== 'superadmin' && u.status === 'active';
  const canUnsuspend = u && u.status === 'suspended';
  const canChangeRole = me.role === 'superadmin' && u && u.id !== me.id;

  return (
    <div className="modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-hdr">
          <h3>User #{id}</h3>
          <button className="close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {err && <div className="err">{err}</div>}
          {!data ? <div className="loading">Loading…</div> :
          <>
            <dl className="kv">
              <dt>Email</dt>       <dd>{u.email}</dd>
              <dt>Name</dt>        <dd>{u.name || '—'}</dd>
              <dt>Plan</dt>        <dd><PlanBadge plan={u.plan} /></dd>
              <dt>Trial</dt>       <dd>
                <TrialBadge trial={u.trial} />
                {u.trial_started_at && <span style={{marginLeft:8,color:'#9ca3af',fontSize:11}}>started {fmtShort(u.trial_started_at)}{u.trial_converted_at?` · converted ${fmtShort(u.trial_converted_at)}`:''}</span>}
              </dd>
              <dt>Role</dt>        <dd><RoleBadge role={u.role} /></dd>
              <dt>Status</dt>      <dd><StatusBadge s={u.status} /></dd>
              <dt>Joined</dt>      <dd>{fmtDate(u.created_at)}</dd>
              <dt>Signup location</dt> <dd>{fmtSignupLocation(u)} {u.signup_ip && <span className="mono" style={{color:'#6b7280',fontSize:11,marginLeft:8}}>IP {u.signup_ip}</span>}</dd>
              <dt>Last active</dt> <dd>{u.last_login_at ? fmtDate(u.last_login_at) : <span style={{color:'#6b7280'}}>never</span>}</dd>
              <dt>Payment</dt>     <dd><PaymentSourceCell sources={data.paymentSources} /></dd>
              <dt>Email consent</dt> <dd>
                {u.emailConsents?.productUpdates === false
                  ? <Badge kind="expired">UNSUBBED · product updates</Badge>
                  : <Badge kind="active">subscribed · product updates</Badge>}
                {u.emailConsents?.marketing === true && <Badge kind="trialing" style={{marginLeft:6}}>opted-in marketing</Badge>}
                {u.emailConsents?.lastUnsub && (
                  <span style={{marginLeft:8,color:'#9ca3af',fontSize:11}}>
                    last unsub {fmtShort(u.emailConsents.lastUnsub.ts)}
                    {u.emailConsents.lastUnsub.source ? ` via ${u.emailConsents.lastUnsub.source.replace('_',' ')}` : ''}
                  </span>
                )}
              </dd>
            </dl>

            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:20}}>

// ── Invite Codes tab ───────────────────────────────────────────────────
function InvitesTab() {
  const [rows, setRows] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [flash, setFlash] = useState('');

  const load = async () => {
    setRows(null);
    try { const r = await api('/invites'); setRows(r.invites); }
    catch (e) { alert(e.message); setRows([]); }
  };
  useEffect(() => { load(); }, []);

  const revoke = async id => {
    if (!confirm('Revoke this code? Existing redemptions are kept.')) return;
    try { await api('/invites/' + id, { method:'DELETE' }); await load(); }
    catch (e) { alert(e.message); }
  };

  return (
    <>
      <h2>Invite / promo codes</h2>
      <div className="sub">Codes new users can enter at signup. Optionally grants a paid plan on redemption.</div>
      {flash && <div className="ok">{flash}</div>}
      <div className="panel">
        <div className="panel-hdr">
          <h3>All codes</h3>
          <div className="right">
            <button className="btn btn-ghost btn-sm" onClick={load}>Refresh</button>
            <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(true)}>New code</button>
          </div>
        </div>
        {rows === null ? <div className="loading">Loading…</div>
         : rows.length === 0 ? <div className="empty">No codes yet. Create one to get started.</div>
         : <table>
            <thead><tr>
              <th>Code</th><th>Plan grant</th><th>Uses</th><th>Expires</th>
              <th>Note</th><th>Created</th><th></th>
            </tr></thead>
            <tbody>{rows.map(r => {
              const exhausted = r.uses >= r.max_uses;
              const expired   = r.expires_at && r.expires_at < Date.now();
              const dead      = exhausted || expired;
              return (
                <tr key={r.id} style={{opacity: dead ? 0.55 : 1}}>
                  <td className="mono" style={{fontWeight:600}}>{r.code}</td>
                  <td>{r.plan_override ? <PlanBadge plan={r.plan_override} /> : <span style={{color:'#6b7280'}}>none</span>}</td>
                  <td className="num">{r.uses}<span style={{color:'#6b7280'}}> / {r.max_uses}</span></td>
                  <td>{r.expires_at ? (expired ? <Badge kind="expired">expired</Badge> : fmtShort(r.expires_at)) : '—'}</td>
                  <td style={{color:'#9ca3af'}}>{r.note || '—'}</td>
                  <td style={{color:'#9ca3af'}}>{fmtShort(r.created_at)}</td>
                  <td>{!dead && <button className="btn btn-ghost btn-sm" onClick={()=>revoke(r.id)}>Revoke</button>}</td>
                </tr>
              );
            })}</tbody>
           </table>}
      </div>
      {showForm && <NewInviteModal onClose={() => setShowForm(false)} onCreated={c => {
        setShowForm(false);
        setFlash('Code created: ' + c);
        setTimeout(()=>setFlash(''), 4000);
        load();
      }} />}
    </>
  );
}

function NewInviteModal({ onClose, onCreated }) {
  const [code, setCode] = useState('');
  const [maxUses, setMaxUses] = useState(1);
  const [planOverride, setPlanOverride] = useState('');
  const [expiresDays, setExpiresDays] = useState('');
  const [note, setNote] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr('');
    try {
      const body = { max_uses: Number(maxUses) };
      if (code.trim())          body.code = code.trim();
      if (planOverride)         body.plan_override = planOverride;
      if (note.trim())          body.note = note.trim();
      if (expiresDays && +expiresDays > 0) body.expires_at = Date.now() + (+expiresDays) * 86400_000;
      const r = await api('/invites', { method:'POST', body: JSON.stringify(body) });
      onCreated(r.code);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
      <form className="modal" onSubmit={submit}>
        <div className="modal-hdr">
          <h3>New invite code</h3>
          <button type="button" className="close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {err && <div className="err">{err}</div>}
          <div className="field">
            <label>Code (optional — leave blank to auto-generate)</label>
            <input className="mono" value={code} onChange={e=>setCode(e.target.value.toUpperCase())}
                   placeholder="LAUNCH50" maxLength={64} />
          </div>
          <div className="field-row">
            <div className="field">
              <label>Max uses</label>
              <input type="number" min="1" value={maxUses} onChange={e=>setMaxUses(e.target.value)} required />
            </div>
            <div className="field">
              <label>Expires in (days, optional)</label>
              <input type="number" min="1" value={expiresDays} onChange={e=>setExpiresDays(e.target.value)} placeholder="never" />
            </div>
          </div>
          <div className="field">
            <label>Grant plan on redemption (optional)</label>
            <select value={planOverride} onChange={e=>setPlanOverride(e.target.value)}>
              <option value="">None — user gets free tier</option>
              <option value="free">free</option>
              <option value="explorer">explorer</option>
              <option value="observer">observer</option>
            </select>
          </div>
          <div className="field">
            <label>Note (internal — who is this for?)</label>
            <input value={note} onChange={e=>setNote(e.target.value)} maxLength={255}
                   placeholder="e.g. Beta tester — jane@example.com" />
          </div>
        </div>
        <div className="modal-ftr">
          <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button type="submit" className="btn btn-primary" disabled={busy}>
            {busy ? 'Creating…' : 'Create code'}
          </button>
        </div>
      </form>
    </div>
  );
}

function BigStat({ label, value, sub, tone }) {
  const colors = { good: '#6ee7b7', warn: '#fbbf24', mute: '#9ca3af' };
  const valueColor = colors[tone] || '#fbbf24';
  return (
    <div className="panel" style={{padding:'14px 18px'}}>
      <div style={{fontSize:11,color:'#9ca3af',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:4}}>{label}</div>
      <div style={{fontSize:24,fontWeight:700,color:valueColor,fontVariantNumeric:'tabular-nums'}}>{value}</div>
      {sub && <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>{sub}</div>}
    </div>
  );
}

function moneyOrUnknown(value) { return value == null ? 'Unknown' : '$' + Number(value).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function PlanCount({ label, n, color }) {
  return (
    <div>
      <div style={{fontSize:11,color:'#9ca3af',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:2}}>{label}</div>
      <div style={{fontSize:22,fontWeight:600,color,fontVariantNumeric:'tabular-nums'}}>{n.toLocaleString()}</div>
    </div>
  );
}

function BarChart({ data, color, emptyText }) {
  if (!data || data.length === 0) {
    return <div className="empty" style={{padding:30}}>{emptyText || 'No data yet — come back tomorrow.'}</div>;
  }
  const max = Math.max(1, ...data.map(d => d.n));
  return (
    <div style={{padding:'12px 18px 14px',display:'flex',alignItems:'flex-end',gap:3,height:90}}>
      {data.map((d, i) => (
        <div key={i} title={`${new Date(d.day).toLocaleDateString()} — ${d.n}`}
             style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
          <div style={{
            width: '100%',
            background: color,
            opacity: 0.65,
            borderRadius: '3px 3px 0 0',
            height: `${Math.max(2, (d.n / max) * 75)}px`,
          }} />
          <div style={{fontSize:9,color:'#6b7280',fontFamily:'DM Mono,monospace'}}>{d.n}</div>
        </div>
      ))}
    </div>
  );
}

// ── Promo / comp modal (per-user grant) ──────────────────────────────
function PromoModal({ userId, paymentSource, onClose, onDone }) {
  const [tab, setTab] = useState('credit');     // 'credit' | 'stripe'
  const [plan, setPlan]   = useState('explorer');
  const [days, setDays]   = useState(30);
  const [reason, setReason] = useState('');
  const [coupon, setCoupon] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function grantCredit(e) {
    e.preventDefault();
    setBusy(true); setErr('');
    try {
      await api('/users/' + userId + '/credit', { method:'POST',
        body: JSON.stringify({ plan, days: Number(days), reason }) });
      onDone();
    } catch (e) { setErr(e.message); setBusy(false); }
  }

  async function applyCoupon(e) {
    e.preventDefault();
    setBusy(true); setErr('');
    try {
      await api('/users/' + userId + '/stripe-coupon', { method:'POST',
        body: JSON.stringify({ couponId: coupon.trim() }) });
      onDone();
    } catch (e) { setErr(e.message); setBusy(false); }
  }

  // Stripe coupon path is only useful if the user actually pays via Stripe.
  // Surface this clearly so an admin doesn't try to apply a coupon to a Play user.
  const stripePathBlocked = paymentSource && paymentSource !== 'stripe';

  return (
    <div className="modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-hdr">
          <h3>Grant promo</h3>
          <button type="button" className="close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div style={{display:'flex',gap:2,borderBottom:'1px solid #1f2937',marginBottom:18,marginTop:-8}}>
            <button type="button"
                    className={'tab' + (tab==='credit' ? ' active' : '')}
                    onClick={()=>{setErr(''); setTab('credit');}}>
              Service credit
            </button>
            <button type="button"
                    className={'tab' + (tab==='stripe' ? ' active' : '')}
                    onClick={()=>{setErr(''); setTab('stripe');}}>
              Stripe coupon
            </button>
          </div>

          {err && <div className="err">{err}</div>}

          {tab === 'credit' && (
            <form onSubmit={grantCredit}>
              <div style={{fontSize:12,color:'#9ca3af',marginBottom:14,lineHeight:1.5}}>
                Grants the user N days of plan X server-side. Works for any
                payment source (or none) — bypasses the store entirely. Use
                for comps, support cases, or "give my friend Pro for a month".
              </div>
              <div className="field-row">
                <div className="field">
                  <label>Plan</label>
                  <select value={plan} onChange={e=>setPlan(e.target.value)}>
                    <option value="explorer">explorer</option>
                    <option value="observer">observer</option>
                  </select>
                </div>
                <div className="field">
                  <label>Days</label>
                  <input type="number" min="1" max="365" value={days}
                         onChange={e=>setDays(e.target.value)} required />
                </div>
              </div>
              <div className="field">
                <label>Reason (audit log + visible to other admins)</label>
                <input value={reason} onChange={e=>setReason(e.target.value)}
                       placeholder="e.g. comp for support case #42" maxLength={255} />
              </div>
              <div className="modal-ftr" style={{marginLeft:-20,marginRight:-20,marginBottom:-20,marginTop:18}}>
                <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
                <button type="submit" className="btn btn-primary" disabled={busy}>
                  {busy ? 'Granting…' : `Grant ${plan} for ${days} days`}
                </button>
              </div>
            </form>
          )}

          {tab === 'stripe' && (
            <form onSubmit={applyCoupon}>
              <div style={{fontSize:12,color:'#9ca3af',marginBottom:14,lineHeight:1.5}}>
                Applies an existing Stripe coupon (created in the Stripe
                dashboard) to the user's active subscription. Use for
                recurring discounts: "20% off forever", "$5 off for 3 months".
              </div>
              {stripePathBlocked && (
                <div style={{background:'#451a03',border:'1px solid #92400e',color:'#fbbf24',padding:10,borderRadius:8,fontSize:12,marginBottom:14}}>
                  This user pays via <strong>{paymentSource}</strong>, not Stripe.
                  Stripe coupons can't be applied to {paymentSource} subscriptions.
                  {paymentSource === 'play'  && ' Mint a Play promo code in the Play Console and hand it to them.'}
                  {paymentSource === 'apple' && ' Mint an offer code in App Store Connect and hand it to them.'}
                  {' '}Or use the Service credit tab for a server-side comp.
                </div>
              )}
              <div className="field">
                <label>Coupon ID (from Stripe dashboard → Products → Coupons)</label>
                <input className="mono" value={coupon} onChange={e=>setCoupon(e.target.value)}
                       placeholder="e.g. LAUNCH20" required />
              </div>
              <div className="modal-ftr" style={{marginLeft:-20,marginRight:-20,marginBottom:-20,marginTop:18}}>
                <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
                <button type="submit" className="btn btn-primary" disabled={busy || !coupon.trim()}>
                  {busy ? 'Applying…' : 'Apply coupon'}
                </button>
              </div>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

            <option value="past_due">past_due</option>
            <option value="canceled">canceled</option>

          <div className="right"><button className="btn btn-ghost btn-sm" onClick={load}>Refresh</button></div>

         : <table>
            <thead><tr>
              <th>User</th><th>Source</th><th>Plan</th><th>Interval</th><th>Status</th><th>Expires</th><th>Updated</th>
            </tr></thead>
            <tbody>{data.subs.map((r, i) => (
              <tr key={i}>
                <td>{r.email || ('#' + r.user_id)}</td>
                <td className="mono"><strong>{SOURCE_LABEL[r.source] || r.source}</strong></td>
                <td><PlanBadge plan={r.plan} /></td>
                <td>{r.billing_interval || '—'}</td>
                <td><Badge kind={r.status === 'active' || r.status === 'trialing' ? 'active' : 'expired'}>{r.status || '—'}</Badge></td>
                <td style={{color:'#9ca3af'}}>{r.expires_ms ? fmtDate(r.expires_ms) : '—'}</td>
                <td style={{color:'#6b7280',fontSize:11}}>{fmtShort(r.updated_at)}</td>
              </tr>
            ))}</tbody>
           </table>}
      </div>
    </>
  );
}

// ── Email lifecycle tab ───────────────────────────────────────────────
//
// Three sub-views:
//   1. Campaigns — config + 30d rollup of sends/opens/clicks/bounces.
//      Click a campaign to open the Preview modal.
//   2. Recent sends — flat log, filterable by campaign.
//   3. Last cron run — last lifecycle.runAndRecord() result for visibility
//      into "did anything fire in the last 15 min?"
function EmailTab() {
  const [campaigns, setCampaigns] = useState(null);
  const [overrides, setOverrides] = useState({});
  const [lastRun, setLastRun]     = useState(null);
  const [sends, setSends]         = useState(null);
  const [filter, setFilter]       = useState('');
  const [previewId, setPreviewId] = useState(null);
  const [previewPlan, setPreviewPlan] = useState('free');
  const [previewHtml, setPreviewHtml] = useState('');
  const [expandedId, setExpandedId] = useState(null); // campaign id whose drill-down row is open
  const [timeSeries, setTimeSeries] = useState({});   // { [id]: { series, thisWindow, priorWindow } }
  const [editSubject, setEditSubject]     = useState('');
  const [editPreheader, setEditPreheader] = useState('');
  const [origSubject, setOrigSubject]     = useState('');
  const [origPreheader, setOrigPreheader] = useState('');
  const [busy, setBusy]           = useState(false);
  const [view, setView]           = useState('list'); // 'list' | 'flow'
  const [waitlistStats, setWaitlistStats]   = useState(null);
  const [waitlistRows, setWaitlistRows]     = useState(null);

  const loadCampaigns = async () => {
    setCampaigns(null);
    try { const r = await api('/email/campaigns'); setCampaigns(r.campaigns); }
    catch (e) { alert(e.message); setCampaigns([]); }
  };
  const loadOverrides = async () => {
    try { const r = await api('/email/overrides'); setOverrides(r.overrides || {}); }
    catch (e) { console.warn(e); }
  };
  const loadLastRun = async () => {
    try { const r = await api('/email/lastrun'); setLastRun(r.lastRun || null); }
    catch (e) { console.warn(e); }
  };
  const loadSends = async () => {
    setSends(null);
    try {
      const q = filter ? '?campaign=' + encodeURIComponent(filter) : '';
      const r = await api('/email/sends' + q);
      setSends(r.sends);
    } catch (e) { alert(e.message); setSends([]); }
  };
  const loadWaitlist = async () => {
    try {
      const [s, l] = await Promise.all([
        api('/waitlist/stats'),
        api('/waitlist?limit=50'),
      ]);
      setWaitlistStats(s);
      setWaitlistRows(l.rows || []);
    } catch (e) { console.warn('waitlist load:', e.message); }
  };
  useEffect(() => { loadCampaigns(); loadOverrides(); loadLastRun(); loadSends(); loadWaitlist(); }, []);
  useEffect(() => { loadSends(); }, [filter]);

  const blastW2 = async () => {
    const n = waitlistStats?.unnotified || 0;
    if (!n) { alert('No unnotified waitlist rows.'); return; }
    if (!confirm('Send the W2 launch announcement to ' + n + ' unnotified waitlist ' +
                 (n === 1 ? 'entry' : 'entries') + '?\n\nThis is a one-way action — once sent, those rows are marked notified.')) return;
    setBusy(true);
    try {
      const r = await api('/waitlist/notify', { method: 'POST' });
      alert('Done.\n\nSent: ' + r.sent + '\nFailed: ' + r.failed + '\nTotal unnotified at start: ' + r.total_unnotified);
      await loadWaitlist();
    } catch (e) { alert(e.message); }
    setBusy(false);
  };
  const exportWaitlist = async () => {
    setBusy(true);
    try {
      const res = await fetch('/api/admin/waitlist/export', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + (getToken() || '') },
      });
      if (!res.ok) throw new Error('export failed: ' + res.status);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'waitlist-' + new Date().toISOString().slice(0,10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  // Re-fetch the preview HTML whenever the user opens a preview, switches
  // plan, or types into the subject/preheader fields. Authenticated fetch
  // (the iframe `src` form would 401 — no Authorization header in a plain
  // src navigation).
  useEffect(() => {
    if (!previewId) { setPreviewHtml(''); return; }
    const draftQ = [];
    if (editSubject   && editSubject   !== origSubject)   draftQ.push('subject='   + encodeURIComponent(editSubject));
    if (editPreheader && editPreheader !== origPreheader) draftQ.push('preheader=' + encodeURIComponent(editPreheader));
    const url = '/email/preview/' + previewId + '?plan=' + previewPlan + (draftQ.length ? '&' + draftQ.join('&') : '');
    let cancelled = false;
    (async () => {
      try {
        const r = await fetch('/api/admin' + url, { headers: { Authorization: 'Bearer ' + (getToken() || '') } });
        const html = await r.text();
        if (!cancelled) setPreviewHtml(html);
      } catch (e) { if (!cancelled) setPreviewHtml('<pre style="color:#fff;padding:24px;">Preview error: ' + e.message + '</pre>'); }
    })();
    return () => { cancelled = true; };
  }, [previewId, previewPlan, editSubject, editPreheader]);

  // When a preview opens, seed the edit form with the saved override or the
  // template's default. The subject/preheader values come from a JSON variant
  // of the preview endpoint (?json=1) so we know the *current effective* text.
  useEffect(() => {
    if (!previewId) return;
    (async () => {
      try {
        const ov = overrides[previewId] || {};
        // Get the TEMPLATE-DEFAULT subject/preheader (no overrides applied)
        // by hitting the JSON endpoint with explicit empty overrides — pass
        // an unlikely-to-collide marker to defeat saved-override merge.
        const r = await fetch('/api/admin/email/preview/' + previewId + '?plan=' + previewPlan + '&json=1', {
          headers: { Authorization: 'Bearer ' + (getToken() || '') },
        });
        const data = await r.json();
        // Saved override (or default if no override set) becomes the editor's
        // starting point. We track the "originals" so we know if the user
        // diverged from the default.
        setOrigSubject(data.subject || '');
        setOrigPreheader(data.preheader || '');
        setEditSubject(ov.subject || data.subject || '');
        setEditPreheader(ov.preheader || data.preheader || '');
      } catch (_) {}
    })();
  }, [previewId]);

  const sendTest = async (id) => {
    if (!confirm('Send TEST ' + id + ' email to your inbox?')) return;
    setBusy(true);
    try {
      const r = await api('/email/test', { method: 'POST', body: JSON.stringify({ campaign: id, plan: previewPlan }) });
      alert('Sent. Resend id: ' + (r.resend_id || '(none)'));
    } catch (e) { alert(e.message); }
    setBusy(false);
  };
  const runNow = async () => {
    if (!confirm('Run the lifecycle sweep RIGHT NOW? This may send live emails.')) return;
    setBusy(true);
    try { const r = await api('/email/runnow', { method: 'POST' }); setLastRun(r); loadCampaigns(); loadSends(); }
    catch (e) { alert(e.message); }
    setBusy(false);
  };
  const saveOverride = async () => {
    if (!previewId) return;
    setBusy(true);
    try {
      const body = {};
      // Send empty string → backend treats as NULL (revert to default).
      // Send same-as-default → also save (admin may want to lock the value).
      body.subject   = editSubject;
      body.preheader = editPreheader;
      await api('/email/overrides/' + previewId, { method: 'POST', body: JSON.stringify(body) });
      await loadOverrides();
      await loadCampaigns();
    } catch (e) { alert(e.message); }
    setBusy(false);
  };
  const clearOverride = async () => {
    if (!previewId) return;
    if (!confirm('Revert ' + previewId + ' to template defaults?')) return;
    setBusy(true);
    try {
      await api('/email/overrides/' + previewId, { method: 'DELETE' });
      await loadOverrides();
      await loadCampaigns();
      setEditSubject(origSubject);
      setEditPreheader(origPreheader);
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const kindColor = (k) => k === 'transactional' ? '#16a34a' : k === 'marketing' ? '#ef4444' : '#f59e0b';
  const groupOf = (id) => id.startsWith('A') ? 'Onboarding'
                       : id.startsWith('B') ? 'Upsell'
                       : id.startsWith('W') ? 'Waitlist'
                       : 'Retention';
  const groups = { Onboarding: [], Upsell: [], Retention: [], Waitlist: [] };
  (campaigns || []).forEach(c => groups[groupOf(c.id)].push(c));

  // Reporting summary across the last 30 days.
  const rep = (() => {
    if (!campaigns || !campaigns.length) return null;
    const total = campaigns.reduce((a, c) => ({
      sent: a.sent + c.sent, suppressed: a.suppressed + c.suppressed,
      delivered: a.delivered + c.delivered, opened: a.opened + c.opened,
      clicked: a.clicked + c.clicked, bounced: a.bounced + c.bounced,
    }), {sent:0, suppressed:0, delivered:0, opened:0, clicked:0, bounced:0});
    const openRate  = total.delivered ? (100 * total.opened  / total.delivered) : null;
    const clickRate = total.opened    ? (100 * total.clicked / total.opened)    : null;
    const bounceRate= total.sent      ? (100 * total.bounced / total.sent)      : null;
    const top = [...campaigns].sort((a,b) => b.sent - a.sent).find(c => c.sent > 0) || null;
    const topClicks = [...campaigns].sort((a,b) => b.clicked - a.clicked).find(c => c.clicked > 0) || null;
    return { total, openRate, clickRate, bounceRate, top, topClicks };
  })();

  return (
    <>
      <h2>Email lifecycle</h2>
      <div className="sub">
        Drip + upsell + retention campaigns. Cron runs every 15 min in-process; transactional billing emails fire from the Stripe webhook directly.
      </div>

      {/* Reporting summary cards (last 30 days) */}
      {rep && (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(160px,1fr))',gap:10,margin:'16px 0'}}>
          <ReportCard label="Sent (30d)" value={rep.total.sent} sub={rep.total.suppressed + ' suppressed'} />
          <ReportCard label="Open rate" value={rep.openRate==null?'—':rep.openRate.toFixed(1)+'%'} sub={rep.total.opened + ' / ' + rep.total.delivered} color="#3b82f6"/>
          <ReportCard label="Click rate" value={rep.clickRate==null?'—':rep.clickRate.toFixed(1)+'%'} sub={rep.total.clicked + ' clicked'} color="#16a34a"/>
          <ReportCard label="Bounce rate" value={rep.bounceRate==null?'—':rep.bounceRate.toFixed(1)+'%'} sub={rep.total.bounced + ' bounced'} color={rep.total.bounced ? '#ef4444' : undefined}/>
          <ReportCard label="Top by sends" value={rep.top ? rep.top.id : '—'} sub={rep.top ? rep.top.sent + ' emails' : ''}/>
          <ReportCard label="Top by clicks" value={rep.topClicks ? rep.topClicks.id : '—'} sub={rep.topClicks ? rep.topClicks.clicked + ' clicks' : ''}/>
        </div>
      )}

      <div className="panel">
        <div className="panel-hdr">
          <h3>Last cron run</h3>
          <div className="right">
            <button className={'btn btn-ghost btn-sm' + (view==='list'?' active':'')} onClick={()=>setView('list')} style={view==='list'?{background:'#1f2937'}:{}}>List</button>
            <button className={'btn btn-ghost btn-sm' + (view==='flow'?' active':'')} onClick={()=>setView('flow')} style={{...(view==='flow'?{background:'#1f2937'}:{}),marginLeft:4}}>Flow</button>
            <button className="btn btn-ghost btn-sm" onClick={loadLastRun} style={{marginLeft:8}}>Refresh</button>
            <button className="btn btn-sm" onClick={runNow} disabled={busy} style={{marginLeft:8}}>Run now</button>
          </div>
        </div>
        {lastRun ? (
          <div style={{padding:'12px 14px',fontSize:13,color:'#cbd5e1'}}>
            Started {fmtDate(lastRun.startedAt)} · took {lastRun.tookMs}ms
            <details style={{marginTop:8}}>
              <summary style={{cursor:'pointer',color:'#9ca3af'}}>Per-campaign breakdown</summary>
              <pre style={{fontSize:11,marginTop:6,color:'#94a3b8',whiteSpace:'pre-wrap'}}>{JSON.stringify(lastRun.breakdown, null, 2)}</pre>
            </details>
          </div>
        ) : <div className="empty">No cron run logged yet (server boots with a 60s warm-up before the first tick).</div>}
      </div>

      {/* Pre-launch waitlist — shows the SIGNUP_CODE-gated intercept queue.
          Stats cards + recent 50 + "Send launch announcement" button. */}
      <div className="panel">
        <div className="panel-hdr">
          <h3>Pre-launch waitlist <span style={{color:'#9ca3af',fontWeight:400,fontSize:12}}>· captured when SIGNUP_CODE gate intercepts a signup</span></h3>
          <div className="right">
            <button className="btn btn-ghost btn-sm" onClick={loadWaitlist} disabled={busy}>Refresh</button>
            <button className="btn btn-ghost btn-sm" onClick={exportWaitlist} disabled={busy} style={{marginLeft:6}}>Export CSV</button>
            <button className="btn btn-sm" onClick={blastW2}
              disabled={busy || !waitlistStats || !waitlistStats.unnotified}
              style={{marginLeft:8,background:waitlistStats && waitlistStats.unnotified ? '#3b82f6' : undefined}}>
              {waitlistStats ? 'Send W2 to ' + (waitlistStats.unnotified || 0) + ' unnotified' : 'Send W2'}
            </button>
          </div>
        </div>
        {waitlistStats && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(160px,1fr))',gap:10,padding:'12px 14px'}}>
            <ReportCard label="Total" value={waitlistStats.total} sub="all-time waitlist"/>
            <ReportCard label="Unnotified" value={waitlistStats.unnotified} sub="awaiting W2 blast" color={waitlistStats.unnotified ? '#fbbf24' : undefined}/>
            <ReportCard label="Notified" value={waitlistStats.notified} sub="W2 already sent" color="#3b82f6"/>
            <ReportCard label="Converted" value={waitlistStats.converted} sub="signed up post-launch" color="#16a34a"/>
          </div>
        )}
        {waitlistRows === null ? <div className="loading">Loading…</div>
         : waitlistRows.length === 0 ? <div className="empty">No waitlist entries yet. Once SIGNUP_CODE is set and a user submits the signup form without the code, they'll show up here.</div>
         : <table>
            <thead><tr>
              <th>Email</th><th>Name</th><th>Source</th><th>Signed up</th>
              <th style={{textAlign:'right'}}>Attempts</th>
              <th>Notified</th><th>Converted</th>
            </tr></thead>
            <tbody>
              {waitlistRows.map(r => (
                <tr key={r.id}>
                  <td className="mono" style={{fontSize:12}}>{r.email}</td>
                  <td style={{color:'#cbd5e1',fontSize:12}}>{r.name || <span style={{color:'#64748b'}}>—</span>}</td>
                  <td style={{color:'#9ca3af',fontSize:12}}>{r.source || <span style={{color:'#64748b'}}>—</span>}</td>
                  <td style={{color:'#9ca3af',whiteSpace:'nowrap',fontSize:12}}>{fmtDate(r.signup_at)}</td>
                  <td className="mono" style={{textAlign:'right',color:r.signup_attempt_count>1?'#fbbf24':'#9ca3af'}}>{r.signup_attempt_count}</td>
                  <td>{r.notified_at
                    ? <span style={{color:'#3b82f6',fontSize:11}}>{fmtDate(r.notified_at)}</span>
                    : <span style={{color:'#64748b',fontSize:11}}>—</span>}</td>
                  <td>{r.converted_user_id
                    ? <span style={{color:'#16a34a',fontSize:11}}>user #{r.converted_user_id}</span>
                    : <span style={{color:'#64748b',fontSize:11}}>—</span>}</td>
                </tr>
              ))}
            </tbody>
           </table>}
      </div>

      {view === 'flow' && <FlowChart campaigns={campaigns||[]} onPick={setPreviewId} kindColor={kindColor}/>}

      {view === 'list' && Object.entries(groups).map(([groupName, list]) => (
        <div className="panel" key={groupName}>
          <div className="panel-hdr">

      {previewId && (

// Per-campaign drill-down: time-series chart + delta vs prior window.
// `data` shape: { series:[{day,sent,delivered,opened,clicked,bounced}],
//                 thisWindow:{...rates}, priorWindow:{...rates}, days:30 }
function CampaignDetail({ data }) {
  const series = data.series || [];
  const days = data.days || 30;
  // Sparkline: 4 stacked lines (sent / opened / clicked / bounced) over 2*days days.
  const W = 720, H = 90, padX = 6, padY = 6;
  const maxY = Math.max(1, ...series.map(r => Math.max(r.sent, r.delivered, r.opened, r.clicked, r.bounced)));
  const xAt = (i) => padX + (i / Math.max(1, series.length - 1)) * (W - 2*padX);
  const yAt = (v) => H - padY - (v / maxY) * (H - 2*padY);
  const path = (key, color) => {
    const d = series.map((r, i) => `${i===0?'M':'L'}${xAt(i).toFixed(1)},${yAt(r[key]).toFixed(1)}`).join('');
    return <path d={d} fill="none" stroke={color} strokeWidth="1.6"/>;
  };
  // Vertical separator at the prior/this-window boundary.
  const sepX = xAt(days);
  const fmtDelta = (cur, prior, label) => {
    if (cur == null && prior == null) return null;
    if (prior == null || prior === 0) {
      return { label, val: cur != null ? cur.toFixed(1) + '%' : '—', delta: '+new', deltaColor: '#16a34a' };
    }
    if (cur == null) return { label, val: '—', delta: '', deltaColor: '#64748b' };
    const d = cur - prior;
    return { label, val: cur.toFixed(1) + '%', delta: (d>=0?'+':'') + d.toFixed(1) + 'pp', deltaColor: d >= 0 ? '#16a34a' : '#ef4444' };
  };
  const cards = [
    fmtDelta(data.thisWindow.open_rate,   data.priorWindow.open_rate,   'Open rate'),
    fmtDelta(data.thisWindow.click_rate,  data.priorWindow.click_rate,  'Click rate'),
    fmtDelta(data.thisWindow.bounce_rate, data.priorWindow.bounce_rate, 'Bounce rate'),
  ].filter(Boolean);
  // Volume delta (counts, not rates)
  const volDelta = data.thisWindow.sent - data.priorWindow.sent;
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 360px',gap:18}}>
      <div>
        <div style={{fontSize:11,color:'#9ca3af',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.04em'}}>Last {2*days} days · daily</div>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{maxWidth:W}}>
          <line x1={sepX} y1={padY} x2={sepX} y2={H-padY} stroke="#374151" strokeWidth="1" strokeDasharray="3,3"/>
          {path('sent',      '#cbd5e1')}
          {path('delivered', '#3b82f6')}
          {path('opened',    '#8b5cf6')}
          {path('clicked',   '#16a34a')}
          {path('bounced',   '#ef4444')}
        </svg>
        <div style={{display:'flex',gap:14,fontSize:11,color:'#9ca3af',flexWrap:'wrap',marginTop:6}}>
          <span style={{display:'inline-flex',alignItems:'center',gap:4}}><span style={{width:14,height:2,background:'#cbd5e1'}}/>Sent</span>
          <span style={{display:'inline-flex',alignItems:'center',gap:4}}><span style={{width:14,height:2,background:'#3b82f6'}}/>Delivered</span>
          <span style={{display:'inline-flex',alignItems:'center',gap:4}}><span style={{width:14,height:2,background:'#8b5cf6'}}/>Opened</span>
          <span style={{display:'inline-flex',alignItems:'center',gap:4}}><span style={{width:14,height:2,background:'#16a34a'}}/>Clicked</span>
          <span style={{display:'inline-flex',alignItems:'center',gap:4}}><span style={{width:14,height:2,background:'#ef4444'}}/>Bounced</span>
          <span style={{marginLeft:'auto',color:'#64748b'}}>Dashed line splits prior {days}d (left) from current {days}d (right)</span>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <div style={{fontSize:11,color:'#9ca3af',textTransform:'uppercase',letterSpacing:'0.04em'}}>Last {days}d vs prior {days}d</div>
        <div style={{background:'#0f1728',border:'1px solid #1f2937',borderRadius:8,padding:'10px 12px'}}>
          <div style={{fontSize:11,color:'#9ca3af'}}>Volume</div>
          <div style={{display:'flex',alignItems:'baseline',gap:8}}>
            <div style={{fontSize:18,fontWeight:700,color:'#e5e7eb'}}>{data.thisWindow.sent}</div>
            <div style={{fontSize:12,color: volDelta >= 0 ? '#16a34a' : '#ef4444'}}>{volDelta>=0?'+':''}{volDelta} vs prior</div>
          </div>
          <div style={{fontSize:11,color:'#64748b'}}>{data.thisWindow.suppressed} suppressed</div>
        </div>
        {cards.map(c => (
          <div key={c.label} style={{background:'#0f1728',border:'1px solid #1f2937',borderRadius:8,padding:'10px 12px'}}>
            <div style={{fontSize:11,color:'#9ca3af'}}>{c.label}</div>
            <div style={{display:'flex',alignItems:'baseline',gap:8}}>
              <div style={{fontSize:18,fontWeight:700,color:'#e5e7eb'}}>{c.val}</div>
              <div style={{fontSize:12,color:c.deltaColor}}>{c.delta}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// Flow chart — SVG diagram of the user journey through campaigns.
// Layout is hand-tuned to read top-to-bottom: signup → onboarding column,
// behavioral upsells branch off to the right, retention branches off the
// left after subscription_cancelled. Click a node → opens preview.
function FlowChart({ campaigns, onPick, kindColor }) {
  const data = Object.fromEntries((campaigns || []).map(c => [c.id, c]));
  // Coordinates: x grouped (0=onboarding, +1=upsell, -1=retention, -2=dunning).
  // y is timeline position. Each unit = 70px.
  const PX = 90, PY = 64;
  const cx = (col) => 360 + col * PX;
  const cy = (row) => 60 + row * PY;
  const NODES = [
    { id: 'SIGNUP', label: 'Signup', col: 0, row: 0, fixed: true },
    { id: 'A1',  col: 0, row: 1 },
    { id: 'A1b', col: 0, row: 2 },
    { id: 'A2',  col: 0, row: 3 },
    { id: 'A2b', col: 0, row: 4 },
    { id: 'A3',  col: 0, row: 5 },
    { id: 'A4',  col: 0, row: 6 },
    { id: 'A5',  col: 0, row: 7 },
    { id: 'A6',  col: 0, row: 8 },
    { id: 'B1',  col: 2, row: 5 },
    { id: 'B2',  col: 2, row: 6 },
    { id: 'B3',  col: 2, row: 7 },
    { id: 'B4',  col: 2, row: 8 },
    { id: 'B5',  col: 2, row: 9 },
    { id: 'B6',  col: 2, row: 4 },
    { id: 'CANCELLED', label: 'Cancellation', col: -2, row: 1, fixed: true },
    { id: 'C1',  col: -2, row: 0 },
    { id: 'C2',  col: -2, row: 2 },
    { id: 'C3',  col: -2, row: 3 },
    { id: 'C4',  col: -2, row: 4 },
    { id: 'PAYFAIL', label: 'Payment failed', col: -3, row: 5, fixed: true },
    { id: 'C5',  col: -3, row: 6 },
    { id: 'C6',  col: -3, row: 7 },
    { id: 'C7',  col: -3, row: 8 },
    { id: 'C8',  col: -3, row: 9 },
    { id: 'C9',  col: 2, row: 11, label: 'C9 · 60d inactive' },
  ];
  // Edges as { from, to, label?, dashed? }.
  const E = [
    { from: 'SIGNUP', to: 'A1' }, { from: 'A1', to: 'A1b' }, { from: 'A1b', to: 'A2' },
    { from: 'A2', to: 'A2b' }, { from: 'A2b', to: 'A3' }, { from: 'A3', to: 'A4' },
    { from: 'A4', to: 'A5' }, { from: 'A5', to: 'A6' },
    // Upsell branches
    { from: 'A3', to: 'B1', dashed: true, label: 'limit hit' },
    { from: 'A5', to: 'B2', dashed: true, label: '5d engaged' },
    { from: 'A5', to: 'B3', dashed: true, label: 'repeat ticker' },
    { from: 'A6', to: 'B4', dashed: true, label: 'explorer manual edits' },
    { from: 'A6', to: 'B5', dashed: true, label: 'multi-device' },
    { from: 'A2b', to: 'B6', dashed: true, label: 'pricing view' },
    // Retention
    { from: 'CANCELLED', to: 'C1', dashed: true, label: 'T-3d annual' },
    { from: 'CANCELLED', to: 'C2', label: 'T+0' },
    { from: 'C2', to: 'C3', label: '+7d' }, { from: 'C3', to: 'C4', label: '+30d' },
    // Dunning
    { from: 'PAYFAIL', to: 'C5' }, { from: 'C5', to: 'C6', label: '+3d' }, { from: 'C6', to: 'C7', label: '+7d' }, { from: 'C7', to: 'C8' },
  ];
  const NODE_W = 100, NODE_H = 36;
  const nodeMap = Object.fromEntries(NODES.map(n => [n.id, n]));
  const W = 980, H = 12 * PY + 80;

  const renderNode = (n) => {
    const x = cx(n.col), y = cy(n.row);
    const c = data[n.id];
    const fill = n.fixed ? '#1f2937' : (c ? '#06090f' : '#06090f');
    const stroke = n.fixed ? '#475569' : (c && c.kind ? kindColor(c.kind) : '#374151');
    const text = c && c.kind ? c.id : (n.label || n.id);
    const sub = c ? (c.sent + ' sent · ' + c.opened + ' opened') : null;
    return (
      <g key={n.id} style={{cursor:c?'pointer':'default'}} onClick={()=>{ if(c) onPick(n.id); }}>
        <rect x={x-NODE_W/2} y={y-NODE_H/2} width={NODE_W} height={NODE_H} rx={8} ry={8} fill={fill} stroke={stroke} strokeWidth={1.5}/>
        <text x={x} y={y - (sub ? 1 : 4)} textAnchor="middle" fill="#e5e7eb" fontSize="12" fontWeight="600" dominantBaseline="middle">{text}</text>
        {sub && <text x={x} y={y+12} textAnchor="middle" fill="#64748b" fontSize="9">{sub}</text>}
      </g>
    );
  };

  const renderEdge = (e, i) => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if (!a || !b) return null;
    const x1 = cx(a.col), y1 = cy(a.row), x2 = cx(b.col), y2 = cy(b.row);
    const sameCol = a.col === b.col;
    const sy = sameCol ? y1 + NODE_H/2 : y1;
    const ey = sameCol ? y2 - NODE_H/2 : y2;
    const path = sameCol
      ? `M${x1},${sy} L${x2},${ey}`
      : `M${x1 + (a.col<b.col?NODE_W/2:-NODE_W/2)},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2 + (b.col<a.col?NODE_W/2:-NODE_W/2)},${y2}`;
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    return (
      <g key={i}>
        <path d={path} stroke="#374151" strokeWidth="1.5" fill="none" strokeDasharray={e.dashed ? '4,4' : null} markerEnd="url(#arrow)"/>
        {e.label && <text x={mx} y={my-4} textAnchor="middle" fill="#64748b" fontSize="10">{e.label}</text>}
      </g>
    );
  };

  return (
    <div className="panel">
      <div className="panel-hdr">
        <h3>User journey flow</h3>
        <div className="right" style={{fontSize:12,color:'#9ca3af'}}>Click a node to preview</div>
      </div>
      <div style={{padding:12,overflowX:'auto'}}>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{minWidth:760,maxWidth:1100}}>
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
            </marker>
          </defs>
          {E.map(renderEdge)}
          {NODES.map(renderNode)}
        </svg>
      </div>
      <div style={{padding:'8px 14px 14px',display:'flex',gap:14,fontSize:11,color:'#9ca3af',flexWrap:'wrap'}}>
        <span style={{display:'inline-flex',alignItems:'center',gap:5}}><span style={{width:10,height:10,borderRadius:2,background:'#16a34a'}}/>Transactional</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:5}}><span style={{width:10,height:10,borderRadius:2,background:'#f59e0b'}}/>Product updates</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:5}}><span style={{width:10,height:10,borderRadius:2,background:'#ef4444'}}/>Marketing</span>
        <span style={{marginLeft:'auto',color:'#64748b'}}>Solid arrows = sequence · Dashed = behavioral trigger</span>
      </div>
    </div>
  );
}

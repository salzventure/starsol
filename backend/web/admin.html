<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarSol Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Geist:wght@300;400;500;600&family=JetBrains+Mono&display=swap">
<style>
:root{--bg:#0a0d12;--surface:#11151c;--raised:#1a2029;--border:#232a36;--text:#fbf3df;--muted:#8c8773;--gold:#d4a44a;--gold2:#f0c668;--red:#c14a2a;--green:#5da888}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Geist,system-ui,sans-serif}header{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(10,13,18,.94);backdrop-filter:blur(12px);z-index:2}.brand{font:italic 25px 'Instrument Serif';letter-spacing:.02em}.brand span{color:var(--gold)}button,input,select{font:inherit}.btn{border:1px solid var(--border);background:var(--raised);color:var(--text);padding:9px 13px;border-radius:6px;cursor:pointer}.btn:hover{border-color:var(--gold)}main{max-width:1320px;margin:auto;padding:34px 28px 70px}h1{font:italic 42px 'Instrument Serif';margin:0 0 4px}h2{font:500 15px Geist;margin:0}.sub{color:var(--muted);margin-bottom:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px}.stat{padding:18px}.label{font:10px 'JetBrains Mono';color:var(--muted);letter-spacing:.13em;text-transform:uppercase}.value{font:500 27px 'JetBrains Mono';margin:9px 0 5px;white-space:nowrap}.hint{font-size:12px;color:var(--muted);line-height:1.45}.warn{color:#e9a483}.good{color:#8fc3aa}.panel{margin:0 0 18px;overflow:hidden}.panel-head{height:49px;padding:0 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.panel-body{padding:17px}.plans{display:flex;gap:30px;flex-wrap:wrap}.plan strong{display:block;font:500 22px 'JetBrains Mono';margin-top:5px}.plan small{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 17px;border-bottom:1px solid var(--border)}th{font:10px 'JetBrains Mono';color:var(--muted);text-transform:uppercase;letter-spacing:.1em}tr:last-child td{border:0}.num{text-align:right}.badge{background:rgba(212,164,74,.1);color:var(--gold2);padding:3px 8px;border-radius:20px;font:11px 'JetBrains Mono'}.charts{display:grid;grid-template-columns:2fr 1fr;gap:18px}.chart{height:150px;display:flex;align-items:end;gap:3px;padding-top:12px}.bar{background:var(--gold);min-height:2px;flex:1;border-radius:2px 2px 0 0;opacity:.8}.bar.err{background:var(--red)}.empty{padding:22px;color:var(--muted)}.login{max-width:410px;margin:90px auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:30px}.login h1{font-size:34px}.field{margin:18px 0}.field label{display:block;margin-bottom:7px}.field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:12px}.primary{width:100%;background:var(--gold);color:#050608;border:0;padding:12px;border-radius:6px;font-weight:600}.error{color:#e9a483;margin:12px 0}.method{font-size:11px;color:var(--muted);line-height:1.6}@media(max-width:760px){.charts{grid-template-columns:1fr}header,main{padding-left:16px;padding-right:16px}.value{font-size:23px}}
</style></head><body>
<header><div class="brand"><span>✦</span> StarSol Admin</div><div><button id="refresh" class="btn" hidden>Refresh</button> <button id="logout" class="btn" hidden>Sign out</button></div></header>
<main><section id="login" class="login"><div class="label">Operations</div><h1>Admin sign in</h1><div class="sub">Use a StarSol admin or superadmin account.</div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div id="loginError" class="error"></div><button class="primary">Sign in</button></form></section><section id="dashboard" hidden><h1>Overview</h1><div class="sub">Business health, engagement, revenue, and reliability at a glance.</div><div id="headline" class="grid"></div><div class="panel"><div class="panel-head"><h2>Users by plan</h2></div><div class="panel-body plans" id="plans"></div></div><div class="panel"><div class="panel-head"><h2>Active subscriptions by source</h2></div><div id="subs"></div></div><div class="panel" id="platformPanel"><div class="panel-head"><h2>Active TV users by platform</h2><span class="hint">last 30 days</span></div><div class="panel-body plans" id="platforms"></div></div><div class="charts"><div class="panel"><div class="panel-head"><h2>Signups · 30 days</h2></div><div class="panel-body"><div id="signups" class="chart"></div></div></div><div class="panel"><div class="panel-head"><h2>Errors · 14 days</h2></div><div class="panel-body"><div id="errors" class="chart"></div></div></div></div><div id="notes" class="method"></div></section></main>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('starsol_admin_token')||localStorage.getItem('ss-token')||'';
async function api(path,opts={}){const r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...opts.headers}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'Request failed');return b}
function money(n){return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}function dur(ms){const h=Math.floor(ms/3600000);return h>=1?h.toLocaleString()+'h':Math.floor(ms/60000)+'m'}
function stat(label,value,hint,tone=''){return `<div class="stat"><div class="label">${label}</div><div class="value ${tone}">${value}</div><div class="hint">${hint}</div></div>`}function plan(label,n){return `<div class="plan"><small>${label}</small><strong>${Number(n||0).toLocaleString()}</strong></div>`}
function chart(id,data,klass=''){const el=$(id),max=Math.max(1,...data.map(x=>x.n));el.innerHTML=data.length?data.map(x=>`<div class="bar ${klass}" style="height:${Math.max(2,x.n/max*100)}%" title="${new Date(x.day).toLocaleDateString()}: ${x.n}"></div>`).join(''):'<div class="empty">No data recorded.</div>'}
async function load(){const d=await api('/admin/metrics');$('headline').innerHTML=stat('MRR',money(d.revenue.mrrApprox),money(d.revenue.arrApprox)+' ARR')+stat('Total users',d.users.total.toLocaleString(),d.users.active+' active')+stat('DAU / WAU / MAU',`${d.engagement.dau} / ${d.engagement.wau} / ${d.engagement.mau}`,'distinct users by login')+stat('Total watch time',dur(d.engagement.totalMs),d.engagement.totalSessions.toLocaleString()+' viewing records')+stat('Churn · 30d',d.churn30d,'canceled Stripe subscriptions',d.churn30d?'warn':'')+stat('Trial funnel',d.trial.active+' active',`${d.trial.converted} converted · ${d.trial.conversionPct??'—'}% · ${d.trial.expired} expired`,d.trial.active?'good':'');$('plans').innerHTML=plan('Free',d.users.byPlan.free)+plan('Explorer',d.users.byPlan.explorer)+plan('Observer',d.users.byPlan.observer)+plan('Institutional',d.users.byPlan.institutional)+plan('Suspended / locked',d.users.suspended);$('subs').innerHTML=d.activeBySource.length?`<table><thead><tr><th>Source</th><th>Plan</th><th>Interval</th><th class="num">Count</th></tr></thead><tbody>${d.activeBySource.map(r=>`<tr><td>${r.source==='play'?'Google Play':'Stripe'}</td><td><span class="badge">${r.plan}</span></td><td>${r.interval}</td><td class="num">${r.n}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No active paid subscriptions yet.</div>';const ps=Object.entries(d.tvByPlatform);$('platformPanel').hidden=!ps.length;$('platforms').innerHTML=ps.map(([k,v])=>plan(k.replaceAll('_',' '),v)).join('');chart('signups',d.signupsByDay);chart('errors',d.errorsByDay,'err');$('notes').textContent=d.revenue.note+' Activity: '+d.methodology.activity+'. Usage: '+d.methodology.usage+'. Errors: '+d.methodology.errors+'.';$('login').hidden=true;$('dashboard').hidden=false;$('refresh').hidden=$('logout').hidden=false}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const b=await r.json();if(!r.ok)throw new Error(b.error||'Sign in failed');token=b.token;localStorage.setItem('starsol_admin_token',token);await load()}catch(e){$('loginError').textContent=e.message}};$('refresh').onclick=load;$('logout').onclick=()=>{localStorage.removeItem('starsol_admin_token');location.reload()};if(token)load().catch(()=>{localStorage.removeItem('starsol_admin_token');token=''});
</script></body></html>
